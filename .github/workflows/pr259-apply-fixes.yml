name: PR259 apply reviewed fixes

on:
  push:
    branches:
      - ajuste/prazo-e-vinculos-simultaneos
    paths:
      - .github/workflows/pr259-apply-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ajuste/prazo-e-vinculos-simultaneos
          fetch-depth: 0

      - name: Apply reviewed patch
        run: python scripts/pr259_apply_reviewed_fixes.py

      - name: Run focused tests
        run: node --test tests/atividade_performance_instrumentation.test.js tests/lista_desafios_nome_backend.test.js tests/meu_giro_resumo_chave_legada.test.js tests/meu_giro_resumo_leitura_cirurgica.test.js tests/meu_giro_resumo_sincronizacao_fluxos.test.js tests/meu_giro_status_apuracao_origem.test.js tests/painel_login_resumo_leve.test.js tests/prazo_vinculos_simultaneos.test.js

      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr259-apply-fixes.yml scripts/pr259_apply_reviewed_fixes.py
          git add "Meu Giro/PainelService.gs" "Meu Giro/RegistroService.gs" "Meu Giro/Utils.gs" tests/
          git diff --cached --check
          git commit -m "Fix resumo locking and enrollment isolation"
          git push origin HEAD:ajuste/prazo-e-vinculos-simultaneos
