name: PR259 ambiguity focused tests
on:
  push:
    branches:
      - ajuste/prazo-e-vinculos-simultaneos
    paths:
      - .github/workflows/pr259-ambiguity-test.yml
permissions:
  contents: read
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ajuste/prazo-e-vinculos-simultaneos
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused tests
        run: >-
          node --test
          tests/atividade_performance_instrumentation.test.js
          tests/lista_desafios_nome_backend.test.js
          tests/meu_giro_resumo_chave_legada.test.js
          tests/meu_giro_resumo_leitura_cirurgica.test.js
          tests/meu_giro_resumo_sincronizacao_fluxos.test.js
          tests/meu_giro_status_apuracao_origem.test.js
          tests/painel_login_resumo_leve.test.js
          tests/prazo_validacao_calendario_lock_corte.test.js
          tests/prazo_vinculos_simultaneos.test.js
          tests/ranking_periodo_precedencia.test.js
          tests/rebuild_periodo_precedencia.test.js
