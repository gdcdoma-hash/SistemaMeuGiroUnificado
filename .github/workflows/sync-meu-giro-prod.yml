name: Sincronizar Meu Giro GAS PROD

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-meu-giro-prod.yml'

jobs:
  sincronizar:
    if: contains(github.event.head_commit.message, '[SYNC_MEU_GIRO_PROD_INITIAL]')
    name: Enviar codigo aprovado ao Meu Giro PROD
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar codigo do GitHub
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Configurar credencial Google
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "ERRO: secret CLASPRC_JSON nao configurado."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Apontar somente para Meu Giro PROD
        shell: bash
        run: |
          printf '{"scriptId":"1gCtXj8xlNLhQi6XSJhQF7c8bxgvVvMuq3-ZmZ4_BIGoubMUs09D8VKY2","rootDir":"Meu Giro"}\n' > .clasp.json
          echo "Destino PROD:"
          jq -r '.scriptId' .clasp.json

      - name: Confirmar arquivos
        run: clasp show-file-status

      - name: Sincronizar codigo no Meu Giro PROD
        run: clasp push --force

      - name: Confirmar que nao houve deployment
        run: |
          echo "Código enviado ao Meu Giro PROD."
          echo "Nenhum deployment foi criado ou atualizado por este workflow."

