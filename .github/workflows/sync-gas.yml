name: Sincronizar Meu Giro GAS

on:
  push:
    branches:
      - main
    paths:
      - 'Meu Giro/**/*.gs'
      - 'Meu Giro/**/*.html'
      - 'Meu Giro/appsscript.json'
      - '.clasp.json'
      - '.github/workflows/sync-gas.yml'
  workflow_dispatch:

concurrency:
  group: gas-meu-giro
  cancel-in-progress: true

jobs:
  sincronizar:
    name: Enviar codigo para Meu Giro GAS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar codigo do GitHub
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar clasp
        run: npm install --global @google/clasp@3.4.1
      - name: Validar credencial configurada
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "ERRO: secret CLASPRC_JSON ainda nao foi configurado no repositorio."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Confirmar arquivos que serao enviados
        run: clasp show-file-status
      - name: Sincronizar com Meu Giro GAS
        run: clasp push --force
