function perfStart(label) {
  if (!PERFORMANCE_DEBUG || !label || typeof console === 'undefined' || !console.time) return;
  console.time(label);
}

function perfEnd(label) {
  if (!PERFORMANCE_DEBUG || !label || typeof console === 'undefined' || !console.timeEnd) return;
  console.timeEnd(label);
}

function perfLog(label, data) {
  if (!PERFORMANCE_DEBUG || !label || typeof console === 'undefined' || !console.log) return;
  console.log('[performance]', label, data || '');
}

function setGlobalLoadingMessage(message) {
  globalLoadingMessage = String(message || '').trim();
  const messageEl = document.getElementById('global-loading-message');
  if (messageEl) {
    messageEl.textContent = globalLoadingMessage || 'Carregando...';
  }
}

function mostrarModalMeuGiro(opcoes) {
  opcoes = opcoes || {};
  const overlay = document.getElementById('global-loading-overlay');
  const card = overlay && overlay.querySelector('.global-loading-card');
  const title = document.getElementById('global-loading-title');
  const message = document.getElementById('global-loading-message');
  const spinner = document.getElementById('global-loading-spinner');
  const actions = document.getElementById('global-loading-actions');
  if (!overlay || !card || !title || !message || !spinner || !actions) {
    return Promise.resolve(null);
  }

  resolverModalMeuGiro(null);
  modalMeuGiroBloqueante = !!opcoes.bloqueante;
  modalMeuGiroOrigem = opcoes.origem || (opcoes.botoes ? 'decisao' : (opcoes.bloqueante ? 'atividade' : ''));
  globalLoadingMessage = String(opcoes.mensagem || '').trim();
  title.textContent = opcoes.titulo || 'MEU GIRO';
  message.textContent = globalLoadingMessage;
  spinner.hidden = opcoes.processando === false;
  actions.innerHTML = '';
  overlay.className = 'global-loading-overlay modal-tipo-' + (opcoes.tipo || 'padrao');

  const botoes = Array.isArray(opcoes.botoes) ? opcoes.botoes : [];
  modalMeuGiroEscapeValue = botoes.length === 1
    ? botoes[0].valor
    : (botoes.length > 1 ? botoes[0].valor : null);
  botoes.forEach(function(botao) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = botao.destaque ? 'btn-main' : 'btn-secondary';
    button.textContent = botao.texto || 'OK';
    button.addEventListener('click', function() {
      resolverModalMeuGiro(botao.valor);
      if (botao.fechar !== false) fecharModalMeuGiro(false);
      if (typeof botao.acao === 'function') botao.acao();
    });
    actions.appendChild(button);
  });

  overlay.hidden = false;
  overlay.setAttribute('aria-hidden', 'false');
  document.body.classList.add('modal-meu-giro-aberto');
  window.setTimeout(function() {
    const focusTarget = actions.querySelector('button') || card;
    focusTarget.focus();
  }, 0);

  if (!botoes.length) {
    return Promise.resolve(null);
  }

  return new Promise(function(resolve) {
    modalMeuGiroResolver = resolve;
  });
}

function atualizarModalMeuGiro(opcoes) {
  opcoes = opcoes || {};
  const overlay = document.getElementById('global-loading-overlay');
  if (!overlay || overlay.hidden) return;
  const title = document.getElementById('global-loading-title');
  const message = document.getElementById('global-loading-message');
  const spinner = document.getElementById('global-loading-spinner');
  if (opcoes.titulo && title) title.textContent = opcoes.titulo;
  if (opcoes.mensagem && message) {
    globalLoadingMessage = String(opcoes.mensagem).trim();
    message.textContent = globalLoadingMessage;
  }
  if (typeof opcoes.processando === 'boolean' && spinner) spinner.hidden = !opcoes.processando;
  if (opcoes.origem) modalMeuGiroOrigem = opcoes.origem;
  if (opcoes.tipo) overlay.className = 'global-loading-overlay modal-tipo-' + opcoes.tipo;
}

function resolverModalMeuGiro(valor) {
  if (!modalMeuGiroResolver) return;
  const resolver = modalMeuGiroResolver;
  modalMeuGiroResolver = null;
  resolver(valor);
}

function fecharModalMeuGiro(resolverPendente) {
  const overlay = document.getElementById('global-loading-overlay');
  if (resolverPendente !== false) resolverModalMeuGiro(null);
  globalLoadingMessage = '';
  modalMeuGiroBloqueante = false;
  modalMeuGiroOrigem = '';
  modalMeuGiroEscapeValue = null;
  if (overlay) {
    overlay.hidden = true;
    overlay.setAttribute('aria-hidden', 'true');
  }
  if (document.body) document.body.classList.remove('modal-meu-giro-aberto');
}

function showGlobalLoading(message) {

    bloqueante: true,
    processando: true,
    origem: 'global-loading'

function hideGlobalLoading() {
  fecharModalMeuGiro();
}

function getGlobalBusyMessage() {
  if (globalLoadingMessage) return globalLoadingMessage;
  if (loginInProgress) return 'Entrando no Meu Giro...';
  if (certificadoProcessandoKey) return 'Gerando certificado...';
  if (activityMutationInProgress) return 'Salvando sua atividade...';
  if (rankingLoadInProgress) return 'Carregando ranking...';
  if (painelLoadInProgress) return 'Preparando seu painel...';
  return 'Carregando...';
}

function syncGlobalBusyState() {
  const root = document.body;
  if (!root) return;

  const isBusy = loginInProgress
    || painelLoadInProgress
    || rankingLoadInProgress
    || phraseLoadInProgress
    || activityMutationInProgress
    || !!certificadoProcessandoKey;

  root.classList.toggle('app-busy', isBusy);
  if (isBusy) {
    if (!modalMeuGiroBloqueante || modalMeuGiroOrigem === 'global-loading') {
      showGlobalLoading(getGlobalBusyMessage());
    }
  } else if (modalMeuGiroOrigem === 'global-loading') {
    hideGlobalLoading();
  }
}

document.addEventListener('keydown', function(event) {
  if (event.key !== 'Escape') return;
  const overlay = document.getElementById('global-loading-overlay');
  if (!overlay || overlay.hidden) return;

  event.preventDefault();
  event.stopPropagation();
  if (modalMeuGiroBloqueante || !modalMeuGiroResolver) return;

  const escapeValue = modalMeuGiroEscapeValue;
  resolverModalMeuGiro(escapeValue);
  fecharModalMeuGiro(false);
}, true);

document.addEventListener('click', function(event) {
  const overlay = document.getElementById('global-loading-overlay');
  if (overlay && event.target === overlay) {
    event.preventDefault();
    event.stopPropagation();
  }
}, true);

function showScreen(name) {
  const screens = document.querySelectorAll('.screen');
  screens.forEach(function(screen) {
    screen.classList.remove('active');
  });

  const target = document.getElementById('screen-' + name);
  if (target) {
    target.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    syncNavegacaoV2(name);
    persistirEstadoPainel({
      tela: String(name || '').trim()
    });
  }
}

function normalizarDestinoV2Persistido(destino) {
  var valor = String(destino || '').trim();
  var compatibilidade = {
    painel: 'home',
    admin_cert: 'admin'
  };

  valor = compatibilidade[valor] || valor;
  return TELAS_RELEVANTES_SESSAO[valor] ? valor : 'home';
}

function getDestinoV2PorTela(tela) {
  var nomeTela = String(tela || '').trim();
  var destinos = Object.keys(NAVEGACAO_V2_DESTINOS);

  for (var i = 0; i < destinos.length; i++) {
    if (NAVEGACAO_V2_DESTINOS[destinos[i]] === nomeTela) {
      return destinos[i];
    }
  }

  return nomeTela === 'ranking' ? 'home' : '';
}

function syncNavegacaoV2(tela) {
  var nav = document.getElementById('nav-v2');
  var autenticado = !!(currentUser && currentUser.id_dgmb);
  syncTopNavigation(autenticado);
  if (!nav) return;

  var nomeTela = String(tela || '').trim();
  var telasSemNavegacaoV2 = {
    inicio: true,
    login: true,
    instrucoes: true,
    'admin-cert': true
  };
  var deveExibir = autenticado && !telasSemNavegacaoV2[nomeTela];
  var destinoAtivo = deveExibir ? getDestinoV2PorTela(nomeTela) : '';

  nav.hidden = !deveExibir;
  document.body.classList.toggle('v2-nav-authenticated', deveExibir);

  nav.querySelectorAll('[data-v2-destination]').forEach(function(item) {
    var isActive = item.getAttribute('data-v2-destination') === destinoAtivo;
    item.classList.toggle('active', isActive);
    item.setAttribute('aria-current', isActive ? 'page' : 'false');
  });
}

function syncTopNavigation(autenticado) {
  var isAuthenticated = autenticado === undefined
    ? !!(currentUser && currentUser.id_dgmb)
    : !!autenticado;
  var menuPublico = document.getElementById('menu-publico-top');
  var menuAutenticado = document.getElementById('menu-autenticado-top');
  var btnLogout = document.getElementById('btn-logout-top');
  var nomeTopo = document.getElementById('painel-nome');
  var nomeUsuario = String((currentUser && currentUser.nome) || '').trim();

  if (menuPublico) menuPublico.hidden = isAuthenticated;
  if (menuAutenticado) menuAutenticado.hidden = true;
  if (btnLogout) btnLogout.hidden = !isAuthenticated;
  if (nomeTopo) {
    nomeTopo.hidden = !isAuthenticated;
    nomeTopo.innerText = isAuthenticated ? (nomeUsuario || 'Atleta') : '';
  }
  document.body.classList.toggle('topbar-authenticated', isAuthenticated);
}

function navigateV2(destino) {
  var destinoNormalizado = normalizarDestinoV2Persistido(destino);
  var tela = NAVEGACAO_V2_DESTINOS[destinoNormalizado];

  if (!currentUser || !currentUser.id_dgmb) {
    syncNavegacaoV2('login');
    showScreen('login');
    return;
  }

  if (destinoNormalizado === 'challenges') {
    renderDesafiosV2();
  } else if (destinoNormalizado === 'achievements') {
    renderConquistasV2();
  }
  showScreen(tela || NAVEGACAO_V2_DESTINOS.home);
}

function onlyDigits(value) {
  return String(value || '').replace(/\D/g, '');
}

function readInputValue(inputEl) {
  return String((inputEl && inputEl.value) || '').trim();
}

function sanitizeKmInputValue(value) {
  var cleaned = String(value || '')
    .replace(/\s+/g, '')
    .replace(/[^0-9.,]/g, '');
  var out = '';
  var sepUsed = false;

  for (var i = 0; i < cleaned.length; i++) {
    var ch = cleaned.charAt(i);
    if (/\d/.test(ch)) {
      out += ch;
      continue;
    }

    if ((ch === '.' || ch === ',') && !sepUsed && out.length > 0) {
      out += ch;
      sepUsed = true;
    }
  }

  return out;
}

function releaseRegistroSubmitGuard() {
  const btn = getRegistroSubmitButton();

  registroSubmitGuardActive = false;

  if (registroTapFeedbackTimer) {
    clearTimeout(registroTapFeedbackTimer);
    registroTapFeedbackTimer = null;
  }

  if (!btn) return;

  btn.classList.remove('is-pressed', 'is-instant-loading', 'tap-feedback');
}

function triggerRegistroTapFeedback() {
  const btn = getRegistroSubmitButton();
  if (!btn || btn.disabled) return;

  btn.classList.remove('tap-feedback');
  void btn.offsetWidth;
  btn.classList.add('tap-feedback');

  if (registroTapFeedbackTimer) {
    clearTimeout(registroTapFeedbackTimer);
  }

  registroTapFeedbackTimer = window.setTimeout(function() {
    btn.classList.remove('tap-feedback');
    registroTapFeedbackTimer = null;
  }, 260);
}

function setRegistroPressedState(active) {
  const btn = getRegistroSubmitButton();

  btn.classList.toggle('is-pressed', !!active);

function releaseCancelEditTouchFeedback() {

  }

function triggerCancelEditTouchFeedback() {

function getRegistroBusyMessage() {
  const saveBtn = getRegistroSubmitButton();
  const handler = saveBtn ? String(saveBtn.getAttribute('onclick') || '') : '';
  return handler.indexOf('salvarEdicaoAtividade') !== -1
    ? 'Salvando edição...'
    : 'Aguarde, concluindo a ação atual...';
}

function activateRegistroSubmitGuard() {
  const btn = getRegistroSubmitButton();

  if (!btn || btn.disabled || activityMutationInProgress || registroSubmitGuardActive) {
    return false;
  }

  registroSubmitGuardActive = true;
  btn.classList.add('is-instant-loading');
  return true;
}

function setupRegistroSubmitProtection() {
  const btn = getRegistroSubmitButton();
  if (!btn || btn.dataset.submitProtectionReady === 'true') return;

  btn.dataset.submitProtectionReady = 'true';

  btn.addEventListener('pointerdown', function(event) {
    if (event.button !== undefined && event.button !== 0) return;
    if (btn.disabled) return;

    triggerRegistroTapFeedback();
    setRegistroPressedState(true);
  });

  ['pointerup', 'pointercancel', 'pointerleave', 'blur'].forEach(function(eventName) {
    btn.addEventListener(eventName, function() {
      if (!registroSubmitGuardActive) {
        setRegistroPressedState(false);
      }
    });
  });

  btn.addEventListener('click', function(event) {
    if (btn.disabled || activityMutationInProgress || registroSubmitGuardActive) {
      event.preventDefault();
      event.stopImmediatePropagation();
      setRegistroPressedState(false);
      setRegistroMsg(getRegistroBusyMessage(), 'loading');
      return;
    }

    activateRegistroSubmitGuard();
  }, true);
}

function setupCancelEditTouchFeedback() {
  const btn = getCancelEditButton();
  if (!btn || btn.dataset.touchFeedbackReady === 'true') return;

  btn.dataset.touchFeedbackReady = 'true';

  btn.addEventListener('pointerdown', function(event) {
    if (event.button !== undefined && event.button !== 0) return;
    if (btn.disabled) return;

    triggerCancelEditTouchFeedback();
    btn.classList.add('is-pressed');
  });

  ['pointerup', 'pointercancel', 'pointerleave', 'blur'].forEach(function(eventName) {
    btn.addEventListener(eventName, function() {
      btn.classList.remove('is-pressed');
    });
  });
}

function startLoadingState(btn, msg, loadingText) {
  const text = String(loadingText || 'Processando...');
  let finalized = false;

  if (msg) msg.innerText = text;
  if (btn) btn.disabled = true;

  return function finishLoadingState(nextMessage) {
    if (finalized) return;
    finalized = true;

    if (btn) btn.disabled = false;

    if (msg && typeof nextMessage === 'string') {
      msg.innerText = nextMessage;
    }
  };
}

function setTransientStatus(elementId, message, variant, timeoutMs) {
  const el = document.getElementById(elementId);
  if (!el) return;

  if (statusMessageTimers[elementId]) {
    clearTimeout(statusMessageTimers[elementId]);
    delete statusMessageTimers[elementId];
  }

  const text = String(message || '').trim();
  el.innerText = text;
  el.className = 'msg status-msg';

  if (!text) {
    return;
  }

  el.classList.add('is-visible');

  if (variant === 'loading') {
    el.classList.add('msg-loading');
  } else if (variant === 'error') {
    el.classList.add('msg-error');
  } else if (variant === 'success') {
    el.classList.add('msg-success');
  }

  if (Number(timeoutMs) > 0) {
    statusMessageTimers[elementId] = setTimeout(function() {
      if (el) {
        el.innerText = '';
        el.className = 'msg status-msg';
      }
      delete statusMessageTimers[elementId];
    }, Number(timeoutMs));
  }
}


function buildDesafioCertificadoDomId(prefix, desafio) {
  var baseKey = getDesafioBaseKey_(desafio) || [
    String((desafio && desafio.id_desafio) || '').trim(),
    String((desafio && desafio.id_item_estoque) || '').trim(),
    String((desafio && desafio.nome_desafio) || '').trim()
  ].join('|');

  var slug = String(baseKey || '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 48);

  if (!slug) slug = 'desafio';
  return String(prefix || 'certificado') + '-' + slug;
}

function buildCertificadoDesafioKey_(payload) {
  var data = payload || {};
  return [
    String(data.id_desafio || '').trim(),
    String(data.id_item_estoque || '').trim()
  ].join('|');
}

function setCertificadoLocalMsg(elementId, message, variant, timeoutMs) {
  setTransientStatus(elementId, message, variant, timeoutMs);
  var el = document.getElementById(elementId);
  if (el && String(message || '').trim()) {
    el.classList.add('msg-inline');
  }
}

function persistirSessaoLogin(user) {
  var id = String(user && user.id_dgmb || '').trim();
  if (!id) return;
  var nome = String(user && user.nome || '').trim();
  var cidadeUf = String(user && user.cidade_uf || '').trim();

  try {
    localStorage.setItem(LOGIN_SESSION_STORAGE_KEY, JSON.stringify({
      id_dgmb: id,
      nome: nome,
      cidade_uf: cidadeUf
    }));
  } catch (err) {
    console.warn('Não foi possível persistir a sessão de login.', err);
  }
}

function limparSessaoLoginPersistida() {
  try {
    localStorage.removeItem(LOGIN_SESSION_STORAGE_KEY);
  } catch (err) {
    console.warn('Não foi possível limpar a sessão persistida.', err);
  }
}

function recuperarSessaoLoginPersistida() {
  try {
    var raw = localStorage.getItem(LOGIN_SESSION_STORAGE_KEY);
    if (!raw) return null;

    var parsed = JSON.parse(raw);
    var id = String(parsed && parsed.id_dgmb || '').trim();
    if (!id) return null;

    return {
      id_dgmb: id,
      nome: String(parsed && parsed.nome || '').trim(),
      cidade_uf: String(parsed && parsed.cidade_uf || '').trim()
    };
  } catch (err) {
    console.warn('Não foi possível recuperar a sessão persistida.', err);
    return null;
  }
}

function persistirEstadoPainel(partialState) {
  try {
    var stateAtual = recuperarEstadoPainelPersistido() || {};
    var partial = partialState || {};
    var proximoEstado = {
      tela: stateAtual.tela || 'home',
      desafio_em_foco: stateAtual.desafio_em_foco || ''
    };
    var tela = String(partial.tela || '').trim();
    var desafio = String(partial.desafio_em_foco || '').trim();

    if (tela) {
      proximoEstado.tela = normalizarDestinoV2Persistido(getDestinoV2PorTela(tela) || tela);
    }
    if (partial.hasOwnProperty('desafio_em_foco')) {
      proximoEstado.desafio_em_foco = desafio;
    }

    if (!TELAS_RELEVANTES_SESSAO[proximoEstado.tela]) {
      proximoEstado.tela = 'home';
    }

    localStorage.setItem(PAINEL_STATE_STORAGE_KEY, JSON.stringify(proximoEstado));
  } catch (err) {
    console.warn('Não foi possível persistir o estado do painel.', err);
  }
}

function limparEstadoPainelPersistido() {
  try {
    localStorage.removeItem(PAINEL_STATE_STORAGE_KEY);
  } catch (err) {
    console.warn('Não foi possível limpar o estado persistido do painel.', err);
  }
}

function recuperarEstadoPainelPersistido() {
  try {
    var raw = localStorage.getItem(PAINEL_STATE_STORAGE_KEY);
    if (!raw) return null;

    var parsed = JSON.parse(raw);
    var tela = String(parsed && parsed.tela || '').trim();

      desafio_em_foco: desafio

function applyCpfMask(value) {
  const digits = onlyDigits(value).slice(0, 11);
  if (digits.length <= 3) return digits;
  if (digits.length <= 6) return digits.replace(/(\d{3})(\d+)/, '$1.$2');
  if (digits.length <= 9) return digits.replace(/(\d{3})(\d{3})(\d+)/, '$1.$2.$3');
  return digits.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
}

function login() {
  const cpfInput = document.getElementById('cpf');
  const msg = document.getElementById('login-msg');
  const btn = document.getElementById('btn-login');

  if (!cpfInput || !msg || !btn) return;

  if (loginInProgress) {
    setTransientStatus('login-msg', 'Verificando acesso...', 'loading');
    return;
  }

  const cpf = readInputValue(cpfInput);

  loginInProgress = true;
  setGlobalLoadingMessage('Entrando no Meu Giro...');
  syncGlobalBusyState();
  setTransientStatus('login-msg', 'Verificando acesso...', 'loading');
  const finishLoadingBase = startLoadingState(btn, msg, 'Verificando acesso...');
  const finishLoading = function(nextMessage) {
    finishLoadingBase(nextMessage);
    loginInProgress = false;
    syncGlobalBusyState();
  };

  try {
    google.script.run
      .withSuccessHandler(function(res) {
        finishLoading();

        if (!res || !res.ok) {
          setTransientStatus('login-msg', (res && res.msg) ? res.msg : 'Não foi possível entrar.', 'error');
          return;
        }

        const userId = res.data && res.data.id_dgmb ? String(res.data.id_dgmb).trim() : '';
        if (!userId) {
          currentUser = null;
          setTransientStatus('login-msg', 'Sessão inválida. Entre novamente.', 'error');
          return;
        }

        currentUser = {
          id_dgmb: userId,
          nome: res.data && res.data.nome ? res.data.nome : '',
          cidade_uf: res.data && res.data.cidade_uf ? res.data.cidade_uf : ''
        };

        setTransientStatus('login-msg', '');

        persistirSessaoLogin(currentUser);
        syncAdminValidacaoVisibility();
        navigateV2('home');
        carregarPainel();
      })
      .withFailureHandler(function(err) {
        finishLoading();
        setTransientStatus('login-msg', 'Erro de conexão. Tente novamente.', 'error');
        console.error(err);
      })
      .loginCPF(cpf);
  } catch (err) {
    finishLoading();
    setTransientStatus('login-msg', 'Erro de conexão. Tente novamente.', 'error');
    console.error(err);
  }
}

    if (phraseBox) {

      phraseBox.classList.add('phrase-box-updated');

    if (phraseCard) {

      phraseCard.classList.add('phrase-card-updated');
    }

    phraseFeedbackTimeout = setTimeout(function() {
      feedback.textContent = '';
      feedback.classList.remove('is-visible', 'phrase-feedback-success');

      if (phraseBox) {
        phraseBox.classList.remove('phrase-box-updated');

  var status = String(statusText || '').toLowerCase();

  if (status.indexOf('adiant') !== -1 || status.indexOf('em dia') !== -1) {
    return 'alerta-ritmo-bom';
  }

  if (status.indexOf('aten') !== -1 || status.indexOf('atras') !== -1 || status.indexOf('aceler') !== -1) {
    return 'alerta-ritmo-atencao';
  }

  return 'alerta-ritmo-neutro';
}

  const highlightKey = String(highlight.key || '').trim();
  const highlightDate = String(highlight.data || '').trim();
  const highlightKm = formatNumber(highlight.km);

  if (highlightKey) {

function clearPainelProgressFeedback() {
  painelProgressAnimationToken += 1;
  painelProgressFeedbackTimers.forEach(function(timerId) {
    clearTimeout(timerId);
  });
  painelProgressFeedbackTimers = [];

  [
    'realizado-km',
    'restante-km',
    'progress-percent',
    'progress-text'
  ].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) {
      el.classList.remove('painel-value-flash', 'painel-value-pulse');
    }
  });
}

function animatePainelValue(id, fromValue, toValue, suffix, durationMs) {
  var el = document.getElementById(id);
  if (!el) return;
  var animationToken = painelProgressAnimationToken;

  var start = Number(fromValue);
  var end = Number(toValue);
  if (!Number.isFinite(start) || !Number.isFinite(end)) {
    el.innerText = formatNumber(end) + (suffix || '');
    return;
  }

  var delta = end - start;
  if (!delta) {
    el.innerText = formatNumber(end) + (suffix || '');
    return;
  }

  var maxDuration = Math.min(durationMs || 900, 1200);
  var startAt = null;

  function step(timestamp) {
    if (animationToken !== painelProgressAnimationToken) {
      return;
    }

    if (startAt === null) startAt = timestamp;
    var progress = Math.min((timestamp - startAt) / maxDuration, 1);
    var eased = 1 - Math.pow(1 - progress, 3);
    var value = start + (delta * eased);
    el.innerText = formatNumber(value) + (suffix || '');

    if (progress < 1) {
      window.requestAnimationFrame(step);
      return;
    }

    el.innerText = formatNumber(end) + (suffix || '');
  }

  window.requestAnimationFrame(step);
}

function playPainelProgressFeedback(previousPainel, nextPainel) {
  if (painelProgressFeedbackMode !== 'activity-registered') {
    return;
  }

  painelProgressFeedbackMode = '';

  if (!previousPainel || !nextPainel) {
    return;
  }

  var previousRealizado = toFiniteNumber(previousPainel.realizado, 0);
  var nextRealizado = toFiniteNumber(nextPainel.realizado, previousRealizado);
  var previousRestante = toFiniteNumber(previousPainel.restante, 0);
  var nextRestante = toFiniteNumber(nextPainel.restante, previousRestante);
  var previousPercentual = toFiniteNumber(previousPainel.percentual, 0);
  var nextPercentual = toFiniteNumber(nextPainel.percentual, previousPercentual);

  var realizouAvanco = nextRealizado > previousRealizado;
  var reduziuRestante = nextRestante < previousRestante;
  var percentualMudou = nextPercentual !== previousPercentual;

  if (!realizouAvanco && !reduziuRestante && !percentualMudou) {
    return;
  }

  clearPainelProgressFeedback();

  var realizadoEl = document.getElementById('realizado-km');
  var restanteEl = document.getElementById('restante-km');
  var percentEl = document.getElementById('progress-percent');
  var progressTextEl = document.getElementById('progress-text');

  if (realizouAvanco && realizadoEl) {
    realizadoEl.classList.add('painel-value-flash');
  }

  if (reduziuRestante && restanteEl) {
    restanteEl.classList.add('painel-value-flash');
  }

  if (percentualMudou && percentEl) {
    percentEl.classList.add('painel-value-pulse', 'painel-value-flash');
  }

  if ((realizouAvanco || reduziuRestante) && progressTextEl) {
    progressTextEl.classList.add('painel-value-flash');
  }

  var percentualDiff = Math.abs(nextPercentual - previousPercentual);
  var realizadoDiff = Math.abs(nextRealizado - previousRealizado);
  var restanteDiff = Math.abs(previousRestante - nextRestante);
  var shouldAnimateNumbers = percentualDiff <= 12 && realizadoDiff <= 60 && restanteDiff <= 60;

  if (shouldAnimateNumbers) {
    if (realizouAvanco) {
      animatePainelValue('realizado-km', previousRealizado, nextRealizado, '', 900);
    }

    if (reduziuRestante) {
      animatePainelValue('restante-km', previousRestante, nextRestante, '', 900);
    }

    if (percentualMudou) {
      animatePainelValue('progress-percent', previousPercentual, nextPercentual, '%', 1050);
    }
  }

  painelProgressFeedbackTimers.push(window.setTimeout(function() {
    clearPainelProgressFeedback();
    setTextById('realizado-km', formatNumber(nextRealizado));
    setTextById('restante-km', formatNumber(nextRestante));
    setTextById('progress-percent', formatNumber(nextPercentual) + '% concluído');
    setTextById(
      'progress-text',
      formatNumber(nextRealizado) + ' km de ' + formatNumber(toFiniteNumber(nextPainel.meta, 0)) + ' km'
    );
  }, 1600));
}

function clearRankingPreviewFeedback() {

function clearTotalPedaladoFeedback() {

  }

  }
}

function animateTotalPedaladoValue(fromValue, toValue, durationMs) {
  var totalEl = document.getElementById('total-pedalado');
  if (!totalEl) return;
  var animationToken = totalPedaladoAnimationToken;

  var start = Number(fromValue);
  var end = Number(toValue);

  if (!Number.isFinite(start) || !Number.isFinite(end) || start === end) {
    totalEl.innerText = formatNumber(end);
    return;
  }

  var startAt = null;
  var maxDuration = Math.min(durationMs || 960, 1200);

  function step(timestamp) {
    if (animationToken !== totalPedaladoAnimationToken) return;
    if (startAt === null) startAt = timestamp;

    var progress = Math.min((timestamp - startAt) / maxDuration, 1);
    var eased = 1 - Math.pow(1 - progress, 3);
    var value = start + ((end - start) * eased);
    totalEl.innerText = formatNumber(value);

    if (progress < 1) {
      window.requestAnimationFrame(step);
      return;
    }

    totalEl.innerText = formatNumber(end);
  }

  window.requestAnimationFrame(step);
}

function playTotalPedaladoFeedback(previousContexto, nextContexto) {
  if (!pendingTotalPedaladoFeedback) {
    return;
  }

  pendingTotalPedaladoFeedback = false;

  var totalEl = document.getElementById('total-pedalado');
  if (!totalEl || !nextContexto) {
    return;
  }

  var previousTotal = toFiniteNumber(
    previousContexto && (previousContexto.totalPedalado || previousContexto.realizado),
    0
  );
  var nextTotal = toFiniteNumber(nextContexto.totalPedalado || nextContexto.realizado, previousTotal);
  var totalDiff = Math.abs(nextTotal - previousTotal);
  var shouldAnimateValue = totalDiff > 0 && totalDiff <= 60;

  clearTotalPedaladoFeedback();
  void totalEl.offsetWidth;
  totalEl.classList.add('total-pedalado-flash', 'total-pedalado-pulse');

  if (shouldAnimateValue) {
    animateTotalPedaladoValue(previousTotal, nextTotal, 980);
  } else {
    totalEl.innerText = formatNumber(nextTotal);
  }

  totalPedaladoFeedbackTimer = window.setTimeout(function() {
    clearTotalPedaladoFeedback();
    totalEl.innerText = formatNumber(nextTotal);
  }, 1600);
}

function playRankingPreviewFeedback(previousPainel, nextPainel) {
  var rankingBox = document.getElementById('painel-ranking-box');
  var rankingMain = document.getElementById('painel-posicao-ranking');
  var rankingDetail = document.getElementById('painel-posicao-detalhe');

  if (!rankingBox || !rankingMain || !rankingDetail || !previousPainel || !nextPainel) {
    return;
  }

  var previousPositionSource = previousPainel.posicao_ranking !== null
    && previousPainel.posicao_ranking !== undefined
    && previousPainel.posicao_ranking !== ''
      ? previousPainel.posicao_ranking
      : previousPainel.posicaoRanking;
  var nextPositionSource = nextPainel.posicao_ranking !== null
    && nextPainel.posicao_ranking !== undefined
    && nextPainel.posicao_ranking !== ''
      ? nextPainel.posicao_ranking
      : nextPainel.posicaoRanking;
  var previousParticipantsSource = previousPainel.total_participantes !== null
    && previousPainel.total_participantes !== undefined
    && previousPainel.total_participantes !== ''
      ? previousPainel.total_participantes
      : previousPainel.totalParticipantes;
  var nextParticipantsSource = nextPainel.total_participantes !== null
    && nextPainel.total_participantes !== undefined
    && nextPainel.total_participantes !== ''
      ? nextPainel.total_participantes
      : nextPainel.totalParticipantes;
  var previousPosition = Number(previousPositionSource);
  var nextPosition = Number(nextPositionSource);
  var previousParticipants = Number(previousParticipantsSource);
  var nextParticipants = Number(nextParticipantsSource);
  var hasPreviousPosition = Number.isFinite(previousPosition) && previousPosition > 0;
  var hasNextPosition = Number.isFinite(nextPosition) && nextPosition > 0;
  var rankingBecameAvailable = !hasPreviousPosition && hasNextPosition;
  var positionChanged = hasPreviousPosition && hasNextPosition && previousPosition !== nextPosition;
  var participantsChanged = Number.isFinite(previousParticipants) && Number.isFinite(nextParticipants) && previousParticipants !== nextParticipants;
  var synchronized = hasNextPosition || Number.isFinite(nextParticipants);

  if (!positionChanged && !participantsChanged && !synchronized) {
    return;
  }

  clearRankingPreviewFeedback();
  clearRankingButtonFeedback();
  lastRankingTriggerButton = null;
  void rankingBox.offsetWidth;

  rankingBox.classList.add('ranking-preview-highlight');
  rankingBox.setAttribute('data-sync-label', 'Sincronizado');
  rankingMain.classList.add('ranking-preview-pulse');

  if (positionChanged || rankingBecameAvailable) {
    rankingBox.classList.add('ranking-preview-shift');
    rankingMain.classList.add('ranking-preview-shift-text');
    rankingDetail.classList.add('ranking-preview-shift-text');
  }

  rankingPreviewFeedbackTimer = window.setTimeout(function() {
    clearRankingPreviewFeedback();
  }, 1700);
}



function getDesafioMergeKeyPosSalvarLeve_(desafio) {
  var d = desafio || {};
  return [
    String(d.id_inscricao || '').trim(),
    String(d.id_desafio || '').trim(),
    String(d.id_item_estoque || '').trim()
  ].join('|');
}

function mesclarDesafioPosSalvarLeve_(desafioAtual, desafioLeve) {
  var base = desafioAtual || {};
  var leve = desafioLeve || {};
  var merged = {};

  Object.keys(base).forEach(function(key) {
    merged[key] = base[key];
  });
  Object.keys(leve).forEach(function(key) {
    var valor = leve[key];
    if (valor !== null && valor !== undefined && valor !== '') {
      merged[key] = valor;
    }
  });

  return merged;
}

function mesclarListasDesafiosPosSalvarLeve_(listaAtual, listaLeve) {
  var base = Array.isArray(listaAtual) ? listaAtual : [];
  var leve = Array.isArray(listaLeve) ? listaLeve : [];
  var basePorChave = {};

  base.forEach(function(item) {
    var chave = getDesafioMergeKeyPosSalvarLeve_(item);
    if (chave !== '||') basePorChave[chave] = item;
  });

  return leve.map(function(item) {
    var chave = getDesafioMergeKeyPosSalvarLeve_(item);
    return mesclarDesafioPosSalvarLeve_(basePorChave[chave], item);
  });
}

function mesclarPainelPosSalvarLeve_(painelAtual, painelLeve) {
  var base = painelAtual || {};
  var leve = painelLeve || {};
  var merged = {};

  Object.keys(base).forEach(function(key) {
    merged[key] = base[key];
  });
  Object.keys(leve).forEach(function(key) {
    merged[key] = leve[key];
  });

  merged.desafios = mesclarListasDesafiosPosSalvarLeve_(base.desafios, leve.desafios);
  merged.desafios_ativos = mesclarListasDesafiosPosSalvarLeve_(base.desafios_ativos, leve.desafios_ativos);
  merged.desafios_historico = mesclarListasDesafiosPosSalvarLeve_(base.desafios_historico, leve.desafios_historico);
  merged.desafio_em_foco = mesclarDesafioPosSalvarLeve_(base.desafio_em_foco, leve.desafio_em_foco);

  // O fluxo leve não recalcula ranking. Preserva o último preview do painel e
  // deixa a tela Ranking buscar dados atualizados sob demanda após a invalidação.
  merged.posicao_ranking = base.posicao_ranking;
  merged.total_participantes = base.total_participantes;
  merged.posicaoRanking = base.posicaoRanking;
  merged.totalParticipantes = base.totalParticipantes;
  merged.ranking_por_desafio = base.ranking_por_desafio || {};

  return merged;
}

function carregarPainelPosSalvarLeve(permitirDuranteMutacao) {
  var painelPerfLabel = 'carregarPainelPosSalvarLeve';
  perfStart(painelPerfLabel);
  if (!currentUser || !currentUser.id_dgmb) {
    perfEnd(painelPerfLabel);
    setTransientStatus('login-msg', 'Sua sessão expirou. Entre novamente.', 'error');
    showScreen('login');
    return;
  }

  if (painelLoadInProgress) {
    perfEnd(painelPerfLabel);
    painelReloadPending = true;
    setPainelMsg('Atualizando painel...', 'loading');
    return;
  }

  if (activityMutationInProgress && !permitirDuranteMutacao) {
    perfEnd(painelPerfLabel);
    painelReloadPending = true;
    return;
  }

  painelLoadInProgress = true;
  painelReloadPending = false;
  painelLoadRequestId += 1;
  const requestId = painelLoadRequestId;

  setManualPainelRefreshDisabled(true);
  setPainelMsg('Atualizando atividades...', 'loading');

  google.script.run
    .withSuccessHandler(function(res) {
      if (requestId !== painelLoadRequestId) {
        return;
      }

      painelLoadInProgress = false;
      perfEnd(painelPerfLabel);
      syncGlobalBusyState();
      setManualPainelRefreshDisabled(false);

      if (!res || !res.ok) {
        setPainelMsg((res && res.msg) ? res.msg : 'Erro ao atualizar atividades. Recarregando painel completo...', 'error');
        painelReloadPending = false;
        carregarPainel('pos-salvar-fallback', permitirDuranteMutacao);
        return;
      }

      var previousPainel = currentPainel;
      var focoAntesDaAtualizacao = String(desafioEmFocoKey || '').trim();
      var previousPainelContextual = montarPainelContextualPorChave(previousPainel, focoAntesDaAtualizacao);
      var shouldPlayRitmoAgoraFeedback = painelProgressFeedbackMode === 'activity-registered';
      currentPainel = mesclarPainelPosSalvarLeve_(currentPainel, res.data || {});
      if (currentPainel && currentUser) {
        currentUser.nome = String(currentPainel.nome || currentUser.nome || '').trim();
        currentUser.cidade_uf = String(currentPainel.cidade_uf || currentUser.cidade_uf || '').trim();
        persistirSessaoLogin(currentUser);
        syncTopNavigation(true);
      }
      renderPainel(currentPainel);
      var nextPainelContextual = montarPainelContextual(currentPainel, getDesafioEmFocoAtual());
      playTotalPedaladoFeedback(previousPainelContextual, nextPainelContextual);
      playPainelProgressFeedback(previousPainelContextual, nextPainelContextual);
      if (shouldPlayRitmoAgoraFeedback) {
        playRitmoAgoraFeedback();
      }
      setPainelMsg('Atividades atualizadas.', 'success', 1600);

      if (painelReloadPending) {
        carregarPainelPosSalvarLeve(permitirDuranteMutacao);
      }
    })
    .withFailureHandler(function(err) {
      if (requestId !== painelLoadRequestId) {
        return;
      }

      painelLoadInProgress = false;
      perfEnd(painelPerfLabel);
      syncGlobalBusyState();
      setManualPainelRefreshDisabled(false);
      setPainelMsg('Erro de conexão ao atualizar atividades. Recarregando painel completo...', 'error');
      console.error(err);
      painelReloadPending = false;
      carregarPainel('pos-salvar-fallback', permitirDuranteMutacao);
    })
    .getPainelUsuarioPosSalvarLeve(currentUser.id_dgmb);
}

function carregarPainel(triggerSource, permitirDuranteMutacao) {
  var painelPerfLabel = 'carregarPainel' + (triggerSource ? ':' + triggerSource : '');
  perfStart(painelPerfLabel);
  if (!currentUser || !currentUser.id_dgmb) {
    perfEnd(painelPerfLabel);
    setTransientStatus('login-msg', 'Sua sessão expirou. Entre novamente.', 'error');
    showScreen('login');
    return;
  }

  if (painelLoadInProgress) {
    perfEnd(painelPerfLabel);
    painelReloadPending = true;
    setPainelMsg(triggerSource === 'manual'
      ? 'Atualização em andamento...'
      : 'Atualizando painel...',
      'loading');
    return;
  }

  if (activityMutationInProgress && !permitirDuranteMutacao) {
    perfEnd(painelPerfLabel);
    painelReloadPending = true;
    setPainelMsg('Aguarde a operação atual terminar para atualizar o painel.', 'loading');
    return;
  }

  painelLoadInProgress = true;
  setGlobalLoadingMessage('Preparando seu painel...');
  syncGlobalBusyState();
  painelReloadPending = false;
  painelLoadRequestId += 1;
  const requestId = painelLoadRequestId;

  setManualPainelRefreshDisabled(true);
  if (!currentPainel) {
    resetPainelVisualState();
  }
  setPainelMsg(triggerSource === 'manual' ? 'Atualizando painel...' : 'Carregando painel...', 'loading');

  google.script.run
    .withSuccessHandler(function(res) {
      if (requestId !== painelLoadRequestId) {
        return;
      }

      painelLoadInProgress = false;
      perfEnd(painelPerfLabel);
      syncGlobalBusyState();
      setManualPainelRefreshDisabled(false);

      if (!res || !res.ok) {
        if (triggerSource === 'restored') {
          painelReloadPending = false;
          tratarFalhaRestauracaoSessao();
          return;
        }

        setPainelMsg((res && res.msg) ? res.msg : 'Erro ao carregar painel. Tente novamente.', 'error');
        painelReloadPending = false;
        return;
      }

      setPainelMsg(
        triggerSource === 'manual' ? 'Painel atualizado com sucesso.' : 'Painel pronto.',
        'success',
        triggerSource === 'manual' ? 2200 : 1600
      );
      if (triggerSource === 'manual') {
        playManualPainelSuccessFeedback();
      }
      var previousPainel = currentPainel;
      var focoAntesDaAtualizacao = String(desafioEmFocoKey || '').trim();
      var previousPainelContextual = montarPainelContextualPorChave(previousPainel, focoAntesDaAtualizacao);
      var shouldPlayRankingPreviewFeedback = painelProgressFeedbackMode === 'activity-registered';
      var shouldPlayRitmoAgoraFeedback = painelProgressFeedbackMode === 'activity-registered';
      currentPainel = res.data || {};
      if (currentPainel && currentUser) {
        currentUser.nome = String(currentPainel.nome || currentUser.nome || '').trim();
        currentUser.cidade_uf = String(currentPainel.cidade_uf || currentUser.cidade_uf || '').trim();
        persistirSessaoLogin(currentUser);
        syncTopNavigation(true);
      }
      renderPainel(currentPainel);
      var nextPainelContextual = montarPainelContextual(currentPainel, getDesafioEmFocoAtual());
      playTotalPedaladoFeedback(previousPainelContextual, nextPainelContextual);
      playPainelProgressFeedback(previousPainelContextual, nextPainelContextual);
      if (shouldPlayRankingPreviewFeedback) {
        playRankingPreviewFeedback(previousPainel, currentPainel);
      }
      if (shouldPlayRitmoAgoraFeedback) {
        playRitmoAgoraFeedback();
      }

      if (painelReloadPending) {
        carregarPainel();
      } else if (triggerSource === 'restored') {
        if (telaPrivadaRestaurada === 'ranking') {
          carregarRanking('restored');
        } else if (telaPrivadaRestaurada === 'admin' && isAdminValidacaoUser()) {
          openAdminValidacao();
        } else {
          navigateV2(telaPrivadaRestaurada);
        }
      }
    })
    .withFailureHandler(function(err) {
      if (requestId !== painelLoadRequestId) {
        return;
      }

      painelLoadInProgress = false;
      perfEnd(painelPerfLabel);
      syncGlobalBusyState();
      setManualPainelRefreshDisabled(false);

      if (triggerSource === 'restored') {
        painelReloadPending = false;
        console.error(err);
        tratarFalhaRestauracaoSessao();
        return;
      }

      setPainelMsg('Erro de conexão ao atualizar painel.', 'error');
      console.error(err);
      painelReloadPending = false;
    })
    .getPainelUsuario(currentUser.id_dgmb);
}

  });

  mensagem.innerText = concluidos.length ? '' : 'Você ainda não possui conquistas concluídas.';
  mensagem.className = 'msg status-msg conquistas-msg' + (concluidos.length ? '' : ' is-visible msg-inline');
  lista.innerHTML = '';
  secaoConcluidas.hidden = !concluidos.length;

  concluidos.forEach(function(desafio) {
    lista.appendChild(buildConquistaCard_(desafio));
  });
}

function buildConquistaCard_(desafio) {
  var card = document.createElement('article');

      '<div class="conquista-card-metricas">' +
        '<p class="conquista-card-metrica"><span>Meta</span><strong>' + formatNumber(desafio.meta_km) + ' km</strong></p>' +
        '<p class="conquista-card-metrica conquista-card-realizado"><span>Realizado</span><strong>' + formatNumber(desafio.distancia_realizada) + ' km</strong></p>' +

function getDesafioMesAnoPortugues_(desafio) {
  var meses = [
    'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
    'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
  ];
  var inicio = String((desafio && desafio.periodo_inicio) || '').trim();
  var fim = String((desafio && desafio.periodo_fim) || '').trim();
  var data = parseDesafioPeriodoDate_(inicio) || parseDesafioPeriodoDate_(fim);
  if (!data) return getDesafioPeriodoLabelV2_(desafio) || '-';
  return meses[data.getUTCMonth()] + '/' + data.getUTCFullYear();
}

function parseDesafioPeriodoDate_(valor) {
  var texto = String(valor || '').trim();
  var partes;
  if (!texto) return null;
  partes = texto.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (partes) return new Date(Date.UTC(Number(partes[1]), Number(partes[2]) - 1, Number(partes[3])));
  partes = texto.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if (partes) return new Date(Date.UTC(Number(partes[3]), Number(partes[2]) - 1, Number(partes[1])));
  return null;
}

function obterTodosDesafiosPainelV2_(painel) {
  var listas = [painel.desafios_ativos, painel.desafios_historico, painel.desafios];
  var resultado = [];
  var vistos = {};

  listas.forEach(function(lista) {
    (Array.isArray(lista) ? lista : []).forEach(function(item) {
      var chave = getDesafioBaseKey_(item);
      if (!chave || vistos[chave]) return;
      vistos[chave] = true;
      resultado.push(item);
    });
  });
  return resultado;
}

function classificarDesafioV2_(desafio) {
  var statusUsuario = String((desafio && desafio.status_usuario_desafio) || '').trim().toUpperCase();
  var statusApuracao = String((desafio && desafio.status_apuracao) || '').trim().toUpperCase();
  var porStatusUsuario = {
    EM_ANDAMENTO: { grupo: 'andamento', statusHumano: 'Em andamento' },
    CONCLUIDO: { grupo: 'concluidos', statusHumano: 'Concluído' },
    CANCELADO: { grupo: 'historico', statusHumano: 'Cancelado' },
    NAO_CONCLUIDO: { grupo: 'historico', statusHumano: 'Não concluído' }
  };

  if (porStatusUsuario[statusUsuario]) return porStatusUsuario[statusUsuario];
  if (statusApuracao === 'ATIVO') return { grupo: 'andamento', statusHumano: 'Em andamento' };
  if (statusApuracao === 'CONCLUIDO') return { grupo: 'concluidos', statusHumano: 'Concluído' };
  if (statusApuracao === 'CANCELADO') return { grupo: 'historico', statusHumano: 'Cancelado' };
  if (statusApuracao === 'EXPIRADO' || statusApuracao === 'INAPTO' || statusApuracao === 'DESISTENTE' || statusApuracao === 'ENCERRADO') {
    return { grupo: 'historico', statusHumano: 'Não concluído' };
  }
  return { grupo: '', statusHumano: '' };
}

      '<p class="desafio-v2-percentual">' + formatNumber(percentual) + '%</p>' +

  card.addEventListener('click', function() { abrirDetalheDesafioV2_(chave); });

function calcularPercentualDesafio_(meta, realizado) {
  var metaNum = toFiniteNumber(meta, 0);
  if (metaNum <= 0) return 0;
  return Math.max(0, Math.min(100, (toFiniteNumber(realizado, 0) / metaNum) * 100));
}

function abrirDetalheDesafioV2_(chave) {

function getDesafioMesLabelV2_(desafio) {

function getDiaMesAtividade_(value) {
  if (!value) return '-';
  var s = String(value);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return String(Number(s.split('-')[2]));
  var br = formatDateBR(s);
  var match = br.match(/^(\d{1,2})\//);
  return match ? String(Number(match[1])) : br;
}

function getDesafioMesExtensoAnoLabel_(desafio) {

  if (!base) return '-';
  var partes = base.split('-');
  if (partes.length < 2) return getDesafioMesLabelV2_(desafio);
  var meses = [
    'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
    'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
  ];
  var mes = Number(partes[1]);
  var ano = partes[0];
  return (meses[mes - 1] || partes[1]) + '/' + ano;
}

function getDesafioKey(desafio) {

  var idDesafio = String(desafio.id_desafio || '').trim();

  if (idInscricao) return 'INSCRICAO|' + idInscricao;
  if (!idDesafio) return '';
  if (idItem) return idDesafio + '|' + idItem;

function salvarDesafioEmFocoNaSessao(chave) {
  var valor = String(chave || '').trim();
  try {
    if (!valor) {
      sessionStorage.removeItem(DESAFIO_CARROSSEL_SESSION_KEY);
      localStorage.removeItem(DESAFIO_CARROSSEL_SESSION_KEY);
      persistirEstadoPainel({ desafio_em_foco: '' });
      return;
    }
    sessionStorage.setItem(DESAFIO_CARROSSEL_SESSION_KEY, valor);
    localStorage.setItem(DESAFIO_CARROSSEL_SESSION_KEY, valor);
    persistirEstadoPainel({ desafio_em_foco: valor });
  } catch (err) {
    console.warn('Não foi possível salvar o desafio em foco na sessão.', err);
  }
}

function carregarDesafioEmFocoDaSessao() {
  try {
    var valorSessao = String(sessionStorage.getItem(DESAFIO_CARROSSEL_SESSION_KEY) || '').trim();
    if (valorSessao) return valorSessao;

    return String(localStorage.getItem(DESAFIO_CARROSSEL_SESSION_KEY) || '').trim();
  } catch (err) {
