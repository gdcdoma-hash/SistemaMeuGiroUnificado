    return '';
  }
}

function escolherIndiceDesafioMaisRelevante(itens) {
  var lista = Array.isArray(itens) ? itens : [];
  if (!lista.length) return -1;

  var melhorIndice = 0;
  for (var i = 1; i < lista.length; i++) {
    if (compararRelevanciaDesafio(lista[i], lista[melhorIndice]) < 0) {
      melhorIndice = i;
    }
  }
  return melhorIndice;
}

function compararRelevanciaDesafio(a, b) {
  var percentualA = toFiniteNumber(a && a.percentual_concluido, 0);
  var percentualB = toFiniteNumber(b && b.percentual_concluido, 0);
  if (percentualA !== percentualB) {
    return percentualB - percentualA;
  }

  var distanciaA = toFiniteNumber(a && a.distancia_realizada, 0);
  var distanciaB = toFiniteNumber(b && b.distancia_realizada, 0);
  if (distanciaA !== distanciaB) {
    return distanciaB - distanciaA;
  }

  return 0;
}

function parseIsoDateLocal(value) {
  var s = String(value || '').trim();
  var match = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!match) return null;
  return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
}

function calcularRitmoDesafio(meta, realizado, periodoInicio, periodoFim) {
  var now = new Date();
  var inicio = parseIsoDateLocal(periodoInicio) || new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var fim = parseIsoDateLocal(periodoFim) || inicio;

  if (fim.getTime() < inicio.getTime()) {
    var swap = inicio;
    inicio = fim;
    fim = swap;
  }

  var msDia = 24 * 60 * 60 * 1000;
  var diasTotal = Math.max(Math.floor((fim.getTime() - inicio.getTime()) / msDia) + 1, 1);
  var diaAtual = Math.floor((now.getTime() - inicio.getTime()) / msDia) + 1;

  if (diaAtual < 1) diaAtual = 1;
  if (diaAtual > diasTotal) diaAtual = diasTotal;

  var diasRestantes = Math.max(diasTotal - diaAtual, 0);
  var kmIdealPorDia = meta > 0 ? meta / diasTotal : 0;
  var kmIdealHoje = kmIdealPorDia * diaAtual;
  var restante = Math.max(meta - realizado, 0);
  var kmPorDiaRestante = diasRestantes > 0 ? restante / diasRestantes : restante;

  var diferenca = realizado - kmIdealHoje;
  var tolerancia = Math.max(2, meta * 0.01);
  var status = 'Você está à frente da meta.';
  var mensagem = 'Seu progresso está acima do ritmo esperado para este momento do desafio.';

  if (diferenca < -tolerancia) {
    status = 'Você está um pouco abaixo do ritmo.';
    mensagem = 'Alguns pedais extras podem ajudar a recuperar o ritmo do desafio.';
  }

  return {
    diaAtual: diaAtual,
    diasRestantes: diasRestantes,
    kmIdealAtual: kmIdealHoje,
    kmPorDiaRestante: kmPorDiaRestante,
    ritmo_status: status,
    ritmo_mensagem: mensagem
  };
}

function calcularProgressoDesafio(meta, realizado) {
  var restante = Math.max(meta - realizado, 0);
  var percentual = meta > 0 ? (realizado / meta) * 100 : 0;

  return {
    restante: restante,
    percentual: Math.max(0, Math.min(100, percentual))
  };
}

function filtrarAtividadesPorPeriodoDesafio(atividades, desafio) {
  var lista = Array.isArray(atividades) ? atividades : [];
  var inicio = String(desafio && desafio.periodo_inicio || '').trim();
  var fim = String(desafio && desafio.periodo_fim || '').trim();

  if (!desafio) return lista;

  if (!inicio || !fim) {
    return {
      items: [],
      erro_periodo: true,
      mensagem: 'Não foi possível filtrar atividades porque este desafio não possui período registrado.'
    };
  }

  return {
    items: lista.filter(function(item) {
      var data = String(item && item.data || '').trim();
      return !!data && data >= inicio && data <= fim;
    }),
    erro_periodo: false,
    mensagem: ''
  };
}

function getDesafioPainelPorChave(painel, chave) {
  var chaveBusca = String(chave || '').trim();
  if (!painel || !chaveBusca) return null;

  var listas = [painel.desafios, painel.desafios_ativos, painel.desafios_historico];
  for (var i = 0; i < listas.length; i++) {
    var itens = Array.isArray(listas[i]) ? listas[i] : [];
    for (var j = 0; j < itens.length; j++) {
      if (getDesafioKey(itens[j]) === chaveBusca) return itens[j] || null;
    }
  }

  return null;
}

function montarPainelContextualPorChave(painel, chave) {
  if (!painel) return null;
  return montarPainelContextual(painel, getDesafioPainelPorChave(painel, chave));
}

function montarFraseContextual(painel, desafio, contexto, fraseBackend) {
  var frasePadrao = 'Cada quilômetro conta. Continue no seu ritmo.';
  if (!desafio) return String(fraseBackend || painel.frase || frasePadrao).trim() || frasePadrao;

  var chaveFocoBackend = getDesafioKey(painel && painel.desafio_em_foco);
  var chaveFocoVisual = getDesafioKey(desafio);
  if (chaveFocoBackend && chaveFocoBackend === chaveFocoVisual) {
    return String(fraseBackend || painel.frase || frasePadrao).trim() || frasePadrao;
  }

  if (toFiniteNumber(contexto && contexto.percentual, 0) >= 100) {
    return 'Meta deste desafio alcançada. Parabéns por cada quilômetro!';
  }

  return 'Cada quilômetro conta neste desafio. Continue no seu ritmo.';
}

function montarPainelContextual(basePainel, desafio) {
  var painel = basePainel || {};
  var desafioAtual = desafio || null;
  var possuiDesafioEmFoco = !!desafioAtual;
  var meta = possuiDesafioEmFoco
    ? toFiniteNumber(desafioAtual.meta_km, 0)
    : toFiniteNumber(painel.meta, 0);
  var realizado = possuiDesafioEmFoco
    ? toFiniteNumber(desafioAtual.distancia_realizada, 0)
    : toFiniteNumber(painel.realizado, 0);
  var periodoInicio = possuiDesafioEmFoco
    ? String(desafioAtual.periodo_inicio || '').trim()
    : String(painel.periodo_inicio || '').trim();
  var periodoFim = possuiDesafioEmFoco
    ? String(desafioAtual.periodo_fim || '').trim()
    : String(painel.periodo_fim || '').trim();
  var progresso = calcularProgressoDesafio(meta, realizado);
  var ritmo = calcularRitmoDesafio(meta, realizado, periodoInicio, periodoFim);

  var rankingPorDesafio = painel.ranking_por_desafio || {};
  var rankingDesafio = rankingPorDesafio[getDesafioKey(desafioAtual)] || {};
  var posicaoRanking = rankingDesafio.posicao !== undefined ? rankingDesafio.posicao : painel.posicao_ranking;
  var totalParticipantes = rankingDesafio.total !== undefined ? rankingDesafio.total : painel.total_participantes;

  var atividadesFiltradas = filtrarAtividadesPorPeriodoDesafio(painel.atividades || [], desafioAtual);
  var contexto = {
    meta: meta,
    realizado: realizado,
    totalPedalado: realizado,
    restante: progresso.restante,
    percentual: progresso.percentual,
    periodo_inicio: periodoInicio,
    periodo_fim: periodoFim,
    diaAtual: ritmo.diaAtual,
    diasRestantes: ritmo.diasRestantes,
    kmIdealAtual: ritmo.kmIdealAtual,
    kmPorDiaRestante: ritmo.kmPorDiaRestante,
    ritmo_status: ritmo.ritmo_status,
    ritmo_mensagem: ritmo.ritmo_mensagem,
    status_operacional: String(
      possuiDesafioEmFoco ? desafioAtual.status_operacional : painel.status_operacional || ''
    ).trim(),
    mensagem_operacional: String(
      possuiDesafioEmFoco ? desafioAtual.mensagem_operacional : painel.mensagem_operacional || ''
    ).trim() || 'Status do desafio em análise.',
    posicao_ranking: posicaoRanking,
    total_participantes: totalParticipantes,
    atividades: Array.isArray(atividadesFiltradas) ? atividadesFiltradas : atividadesFiltradas.items,
    atividades_erro_periodo: !!(atividadesFiltradas && atividadesFiltradas.erro_periodo),
    atividades_mensagem: (atividadesFiltradas && atividadesFiltradas.mensagem) || ''
  };
  contexto.frase = montarFraseContextual(painel, desafioAtual, contexto);

  return contexto;
}


function getDesafioMesAnoLabel(desafio, contexto) {
  var inicio = String((desafio && desafio.periodo_inicio) || (contexto && contexto.periodo_inicio) || '').trim();
  var match = inicio.match(/^(\d{4})-(\d{2})/);
  if (!match) return 'Período: -';
  var nomeMes = getMesNome_(match[2]);
  return nomeMes ? ('Período: ' + nomeMes + '/' + match[1]) : 'Período: -';
}

function renderUltimaAtividadePainel(lista) {
  var atividades = Array.isArray(lista) ? lista.slice() : [];
  var diaEl = document.getElementById('painel-ultima-dia');
  var kmEl = document.getElementById('painel-ultima-km');
  if (!diaEl || !kmEl) return;

  atividades.sort(function(a, b) {
    return String((b && b.data) || '').localeCompare(String((a && a.data) || ''));
  });

  var ultima = atividades[0];
  if (!ultima) {
    diaEl.innerText = 'Nenhuma atividade';
    kmEl.innerText = '0 km';
    return;
  }

  var data = String(ultima.data || '').trim();
  var partes = data.split('-');
  var dia = partes.length >= 3 ? String(Number(partes[2])) : formatDateBR(data);
  diaEl.innerText = dia ? ('Dia ' + dia) : 'Último pedal';
  kmEl.innerText = formatNumber(ultima.km) + ' km';
}

function atualizarContextoVisualRanking(desafioAtual) {
  var nomeDesafio = getDesafioTitulo(desafioAtual || {});
  var titulo = document.getElementById('painel-ranking-context-title');
  var subtitulo = document.getElementById('painel-ranking-context-subtitle');
  var dica = document.getElementById('painel-ranking-context-tip');

  if (titulo) {
    titulo.innerText = desafioAtual
      ? 'Ranking do desafio em foco'
      : 'Ranking do desafio atual';
  }

  if (subtitulo) {
    subtitulo.innerText = desafioAtual
      ? 'Desafio em foco: ' + nomeDesafio
      : 'Selecione um desafio acima para ver o ranking correspondente.';
  }

  if (dica) {
    dica.innerText = 'Use a tela Desafios para escolher o desafio em foco.';
  }
}

function sincronizarPainelComDesafioEmFoco() {
  var painel = currentPainel || {};
  var desafioAtual = getDesafioEmFocoAtual();

  if (desafioAtual) {
    desafioEmFocoKey = getDesafioKey(desafioAtual);
  }

  var contexto = montarPainelContextual(painel, desafioAtual);
  atualizarContextoVisualRanking(desafioAtual);

  setTextById('frase-box', contexto.frase);
  setTextById('desafio-foco-operacional', contexto.mensagem_operacional);
  setTextById('painel-desafio-periodo', getDesafioMesAnoLabel(desafioAtual, contexto));
  setTextById('meta-km', formatNumber(contexto.meta));
  setTextById('realizado-km', formatNumber(contexto.realizado));
  setTextById('restante-km', formatNumber(contexto.restante));
  setTextById('progress-text', formatNumber(contexto.realizado) + ' km de ' + formatNumber(contexto.meta) + ' km');
  setTextById('progress-percent', formatNumber(contexto.percentual) + '% concluído');

  const bar = document.getElementById('progress-bar');
  if (bar) {
    bar.style.width = Math.max(0, Math.min(100, toFiniteNumber(contexto.percentual, 0))) + '%';
  }

  setTextById('ritmo-dia', 'Dia ' + formatNumber(contexto.diaAtual) + ' do desafio.');
  setTextById('ritmo-ideal', formatNumber(contexto.kmIdealAtual) + ' km');
  setTextById('ritmo-atual', 'Você tem ' + formatNumber(contexto.realizado) + ' km.');
  setTextById('ritmo-restante', formatNumber(contexto.diasRestantes) + ' dias');
  setTextById('ritmo-meta', formatNumber(contexto.kmPorDiaRestante) + ' km/dia');
  renderRitmoAgora(contexto);

  const posicaoRanking = Number(contexto.posicao_ranking);
  const totalParticipantes = Number(contexto.total_participantes);
  const hasPosicaoRanking = Number.isFinite(posicaoRanking) && posicaoRanking > 0;
  const posicaoRankingEl = document.getElementById('painel-posicao-ranking');
  const posicaoDetalheEl = document.getElementById('painel-posicao-detalhe');

  if (posicaoRankingEl) {
    posicaoRankingEl.innerText = hasPosicaoRanking
      ? 'Sua posição no ranking: ' + formatNumber(posicaoRanking)
      : 'Abra a tela Ranking para ver sua posição atualizada.';
  }

  if (posicaoDetalheEl) {
    posicaoDetalheEl.innerText = hasPosicaoRanking && Number.isFinite(totalParticipantes) && totalParticipantes > 0
      ? 'Base atual: ' + formatNumber(totalParticipantes) + ' participantes.'
      : 'Ranking carregado somente sob demanda.';
  }

  renderUltimaAtividadePainel(contexto.atividades || (currentPainel && currentPainel.atividades) || []);
  renderAtividades(currentPainel && currentPainel.atividades || []);
}

function setTextById(id, text) {
  const el = document.getElementById(id);
  if (el) {
    el.innerText = text;
  }
}

function renderDesafiosPainel(painel) {
  var desafiosAtivos = normalizarListaDesafiosPainel_(painel.desafios_ativos).filter(function(item) {
    return isDesafioAtivo_(item);
  });
  var desafiosHistorico = normalizarListaDesafiosPainel_(painel.desafios_historico).filter(function(item) {
    return isDesafioHistoricoElegivel_(item);
  });
  var desafiosFallback = normalizarListaDesafiosPainel_(painel.desafios);

  if (desafiosFallback.length) {
    if (!desafiosAtivos.length && !desafiosHistorico.length) {
      desafiosAtivos = desafiosFallback.filter(function(item) { return isDesafioAtivo_(item); });
      desafiosHistorico = desafiosFallback.filter(function(item) { return isDesafioHistoricoElegivel_(item); });
    } else {
      var chavesAtivos = mapearChavesDesafiosBase_(desafiosAtivos);
      var chavesHistorico = mapearChavesDesafiosBase_(desafiosHistorico);
      desafiosFallback.forEach(function(item) {
        var chave = getDesafioBaseKey_(item);
        if (!chave) return;
        if (chavesAtivos[chave] || chavesHistorico[chave]) return;
        if (isDesafioAtivo_(item)) {
          desafiosAtivos.push(item);
          chavesAtivos[chave] = true;
        } else if (isDesafioHistoricoElegivel_(item)) {
          desafiosHistorico.push(item);
          chavesHistorico[chave] = true;
        }
      });
    }
  }

  if (desafiosAtivos.length && desafiosHistorico.length) {
    var ativosMap = mapearChavesDesafiosBase_(desafiosAtivos);
    desafiosHistorico = desafiosHistorico.filter(function(item) {
      return !ativosMap[getDesafioBaseKey_(item)];
    });
  }

  desafiosHistorico.sort(compareDesafioHistorico_);
  desafiosFocoItems = desafiosAtivos.concat(desafiosHistorico);
  var chavesFoco = mapearChavesDesafiosBase_(desafiosFocoItems);
  obterTodosDesafiosPainelV2_(painel).forEach(function(item) {
    var chave = getDesafioBaseKey_(item);
    if (!chave || chavesFoco[chave] || !classificarDesafioV2_(item).grupo) return;
    desafiosFocoItems.push(item);
    chavesFoco[chave] = true;
  });

  var focoMemorizado = String(desafioEmFocoKey || carregarDesafioEmFocoDaSessao() || '').trim();
  var focoExiste = focoMemorizado && desafiosFocoItems.some(function(item) { return getDesafioKey(item) === focoMemorizado; });
  if (focoExiste) {
    desafioEmFocoKey = focoMemorizado;
  } else if (desafiosAtivos.length) {
    desafioEmFocoKey = getDesafioKey(desafiosAtivos[0]);
    salvarDesafioEmFocoNaSessao(desafioEmFocoKey);
  } else if (desafiosHistorico.length) {
    desafioEmFocoKey = getDesafioKey(desafiosHistorico[0]);
    salvarDesafioEmFocoNaSessao(desafioEmFocoKey);
  }

  desafiosAtivosCarouselItems = desafiosAtivos.slice();
  var indiceAtivoEmFoco = -1;
  for (var indiceAtivo = 0; indiceAtivo < desafiosAtivosCarouselItems.length; indiceAtivo++) {
    if (getDesafioKey(desafiosAtivosCarouselItems[indiceAtivo]) === desafioEmFocoKey) {
      indiceAtivoEmFoco = indiceAtivo;
      break;
    }
  }
  if (indiceAtivoEmFoco >= 0) {
    desafiosAtivosCarouselIndex = indiceAtivoEmFoco;
  } else {
    var indiceAtivoRelevante = escolherIndiceDesafioMaisRelevante(desafiosAtivosCarouselItems);
    desafiosAtivosCarouselIndex = indiceAtivoRelevante >= 0 ? indiceAtivoRelevante : 0;
  }

  renderDesafioEmFocoResumo();
  atualizarSeletorDesafioRanking();
}

function renderDesafiosAtivosCarrossel(containerId, lista, options) {
  var box = document.getElementById(containerId);
  if (!box) return;

  options = options || {};
  box.innerHTML = '';

  var itens = Array.isArray(lista) ? lista.slice() : [];
  var indexFromFocus = -1;
  var desafioMemorizado = String(desafioEmFocoKey || carregarDesafioEmFocoDaSessao() || '').trim();

  if (desafioMemorizado) {
    for (var i = 0; i < itens.length; i++) {
      if (getDesafioKey(itens[i]) === desafioMemorizado) {
        indexFromFocus = i;
        break;
      }
    }
  }

  desafiosAtivosCarouselItems = itens;
  if (indexFromFocus >= 0) {
    desafiosAtivosCarouselIndex = indexFromFocus;
  } else if (desafioMemorizado) {
    var focoHistoricoExiste = Array.isArray(desafiosFocoItems) && desafiosFocoItems.some(function(item) {
      return getDesafioKey(item) === desafioMemorizado;
    });
    var indiceMemoriaNaoEncontrada = escolherIndiceDesafioMaisRelevante(itens);
    desafiosAtivosCarouselIndex = indiceMemoriaNaoEncontrada >= 0
      ? indiceMemoriaNaoEncontrada
      : Math.max(0, Math.min(Number(desafiosAtivosCarouselIndex) || 0, Math.max(0, itens.length - 1)));
    if (focoHistoricoExiste) {
      desafioEmFocoKey = desafioMemorizado;
    }
  } else {
    var indiceAtual = Number(desafiosAtivosCarouselIndex);
    if (Number.isInteger(indiceAtual) && indiceAtual >= 0 && indiceAtual < itens.length) {
      desafiosAtivosCarouselIndex = indiceAtual;
    } else {
      var indiceMaisRelevante = escolherIndiceDesafioMaisRelevante(itens);
      desafiosAtivosCarouselIndex = indiceMaisRelevante >= 0
        ? indiceMaisRelevante
        : Math.max(0, Math.min(indiceAtual, Math.max(0, itens.length - 1)));
    }
  }

  if (!itens.length) {
    if (!Array.isArray(desafiosFocoItems) || !desafiosFocoItems.length) {
      desafioEmFocoKey = '';
      salvarDesafioEmFocoNaSessao('');
    }
    var titulo = options.emptyTitle || 'Nenhum desafio para exibir.';
    var descricao = options.emptyDescription || 'Novos desafios serão exibidos aqui assim que estiverem disponíveis.';
    box.innerHTML =
      '<div class="atividade atividade-empty desafio-empty">' +
        '<strong>' + escapeHtml(titulo) + '</strong>' +
        '<p>' + escapeHtml(descricao) + '</p>' +
      '</div>';
    atualizarSeletorDesafioRanking();
    return;
  }

  var focoAtualExiste = desafioEmFocoKey && Array.isArray(desafiosFocoItems) && desafiosFocoItems.some(function(item) {
    return getDesafioKey(item) === desafioEmFocoKey;
  });
  if (!focoAtualExiste || indexFromFocus >= 0) {
    desafioEmFocoKey = getDesafioKey(itens[desafiosAtivosCarouselIndex]);
    salvarDesafioEmFocoNaSessao(desafioEmFocoKey);
  }
  box.appendChild(buildDesafioCard(itens[desafiosAtivosCarouselIndex], { isHistorico: false, allowSelect: true }));

  if (itens.length > 1) {
    var controls = document.createElement('div');
    controls.className = 'desafios-carousel-controls';
    controls.innerHTML =
      '<button type="button" class="desafios-carousel-btn" onclick="navegarDesafioAtivo(-1)" ' + (desafiosAtivosCarouselIndex <= 0 ? 'disabled' : '') + ' aria-label="Desafio anterior">←</button>' +
      '<span class="desafios-carousel-indicador">' + (desafiosAtivosCarouselIndex + 1) + ' de ' + itens.length + '</span>' +
      '<button type="button" class="desafios-carousel-btn" onclick="navegarDesafioAtivo(1)" ' + (desafiosAtivosCarouselIndex >= (itens.length - 1) ? 'disabled' : '') + ' aria-label="Próximo desafio">→</button>';
    box.appendChild(controls);
  }

  atualizarSeletorDesafioRanking();
}

function navegarDesafioAtivo(delta) {
  var total = Array.isArray(desafiosAtivosCarouselItems) ? desafiosAtivosCarouselItems.length : 0;
  if (total <= 1) return;

  var proximoIndice = desafiosAtivosCarouselIndex + Number(delta || 0);
  desafiosAtivosCarouselIndex = Math.max(0, Math.min(total - 1, proximoIndice));
  aplicarDesafioEmFoco(getDesafioKey(desafiosAtivosCarouselItems[desafiosAtivosCarouselIndex]), { silent: true });
}

function onDesafioFocoSelectChange(chave) {
  aplicarDesafioEmFoco(chave, { feedback: true });
}

function selecionarDesafioEmFoco(chave) {
  aplicarDesafioEmFoco(chave, { feedback: true });
}

function aplicarDesafioEmFoco(chave, options) {
  var chaveSelecionada = String(chave || '').trim();
  if (!chaveSelecionada) return;

  var itensFoco = Array.isArray(desafiosFocoItems) ? desafiosFocoItems : [];
  var encontrado = false;
  for (var i = 0; i < itensFoco.length; i++) {
    if (getDesafioKey(itensFoco[i]) === chaveSelecionada) {
      encontrado = true;
      break;
    }
  }
  if (!encontrado) {
    renderDesafioEmFocoResumo();
    return;
  }

  clearPainelProgressFeedback();
  clearTotalPedaladoFeedback();
  desafioEmFocoKey = chaveSelecionada;
  salvarDesafioEmFocoNaSessao(desafioEmFocoKey);

  for (var a = 0; a < desafiosAtivosCarouselItems.length; a++) {
    if (getDesafioKey(desafiosAtivosCarouselItems[a]) === chaveSelecionada) {
      desafiosAtivosCarouselIndex = a;
      break;
    }
  }

  renderDesafioEmFocoResumo(options && options.feedback ? 'Desafio em foco atualizado.' : '');
  atualizarSeletorDesafioRanking();
  sincronizarPainelComDesafioEmFoco();
}

function obterDesafiosHistoricoEmMemoria_() {
  var ativosMap = mapearChavesDesafiosBase_(desafiosAtivosCarouselItems || []);
  return (Array.isArray(desafiosFocoItems) ? desafiosFocoItems : []).filter(function(item) {
    return !ativosMap[getDesafioBaseKey_(item)] && isDesafioHistoricoElegivel_(item);
  }).sort(compareDesafioHistorico_);
}

function renderDesafioEmFocoResumo(feedbackText) {
  var desafioAtual = getDesafioEmFocoAtual();
  var select = document.getElementById('desafio-foco-select');
  var nomeEl = document.getElementById('desafio-foco-nome');
  var periodoEl = document.getElementById('desafio-foco-periodo');
  var statusEl = document.getElementById('desafio-foco-status');
  var feedbackEl = document.getElementById('desafio-foco-feedback');
  var itensFoco = Array.isArray(desafiosFocoItems) ? desafiosFocoItems : [];

  if (nomeEl) nomeEl.innerText = desafioAtual ? getDesafioTitulo(desafioAtual) : '-';
  if (periodoEl) periodoEl.innerText = desafioAtual ? getDesafioPeriodoLabel(desafioAtual) : 'Período não informado';
  if (statusEl) statusEl.innerText = desafioAtual ? (String(desafioAtual.status_apuracao || '-').trim() || '-') : '-';

  if (select) {
    select.innerHTML = '';
    if (!itensFoco.length) {
      var emptyOption = document.createElement('option');
      emptyOption.value = '';
      emptyOption.innerText = 'Sem desafios disponíveis';
      select.appendChild(emptyOption);
      select.disabled = true;
    } else {
      select.disabled = false;
      itensFoco.forEach(function(item) {
        var option = document.createElement('option');
        option.value = getDesafioKey(item);
        option.innerText = getDesafioTitulo(item) + ' · ' + (String(item.status_apuracao || '-').trim() || '-');
        select.appendChild(option);
      });
      select.value = String(desafioEmFocoKey || '');
    }
  }

  if (feedbackEl) {
    feedbackEl.innerText = feedbackText || '';
    feedbackEl.classList.toggle('is-visible', !!feedbackText);
    if (feedbackText) {
      window.setTimeout(function() {
        if (feedbackEl.innerText === feedbackText) {
          feedbackEl.innerText = '';
          feedbackEl.classList.remove('is-visible');
        }
      }, 2600);
    }
  }

  renderCardDesafioSelecionado();
}

function renderCardDesafioSelecionado() {
  var box = document.getElementById('desafio-selecionado-card');
  var desafioAtual = getDesafioEmFocoAtual();
  setTextById('painel-desafio-nome', desafioAtual ? getDesafioTitulo(desafioAtual) : 'Nenhum desafio disponível');
  setTextById('painel-desafio-periodo', getDesafioMesAnoLabel(desafioAtual));
  if (!box) return;
  box.innerHTML = '';
  box.hidden = true;
}

function getDesafioPeriodoLabel(desafio) {
  return desafio && desafio.periodo_inicio && desafio.periodo_fim
    ? formatDateBR(desafio.periodo_inicio) + ' a ' + formatDateBR(desafio.periodo_fim)
    : 'Período não informado';
}

function atualizarSeletorDesafioRanking() {
  var select = document.getElementById('ranking-desafio-select');
  var buttonsWrap = document.getElementById('ranking-desafio-buttons');
  if (!select) return;

  var itens = Array.isArray(desafiosAtivosCarouselItems) ? desafiosAtivosCarouselItems : [];
  select.innerHTML = '';
  if (buttonsWrap) buttonsWrap.innerHTML = '';

  if (!itens.length) {
    var emptyOption = document.createElement('option');
    emptyOption.value = '';
    emptyOption.innerText = 'Sem desafios ativos';
    select.appendChild(emptyOption);
    select.disabled = true;

    if (buttonsWrap) {
      var emptyButton = document.createElement('button');
      emptyButton.type = 'button';
      emptyButton.className = 'ranking-desafio-btn is-active';
      emptyButton.innerText = 'Sem desafios ativos';
      emptyButton.disabled = true;
      buttonsWrap.appendChild(emptyButton);
    }
    return;
  }

  select.disabled = itens.length <= 1;

  var indiceSeguro = Math.max(0, Math.min(itens.length - 1, Number(desafiosAtivosCarouselIndex) || 0));
  if (indiceSeguro !== desafiosAtivosCarouselIndex) {
    desafiosAtivosCarouselIndex = indiceSeguro;
    desafioEmFocoKey = getDesafioKey(itens[indiceSeguro]);
    salvarDesafioEmFocoNaSessao(desafioEmFocoKey);
  }

  itens.forEach(function(item, index) {
    var titulo = getDesafioTitulo(item || {});
    var option = document.createElement('option');
    option.value = String(index);
    option.innerText = titulo;
    select.appendChild(option);

    if (buttonsWrap) {
      var button = document.createElement('button');
      var isActive = index === indiceSeguro;
      button.type = 'button';
      button.className = 'ranking-desafio-btn' + (isActive ? ' is-active' : '');
      button.dataset.rankingDesafioIndex = String(index);
      button.innerText = titulo;
      button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      button.onclick = function() {
        onRankingDesafioSelectorChange(String(index));
      };
      buttonsWrap.appendChild(button);
    }
  });

  select.value = String(indiceSeguro);
}

function onRankingDesafioSelectorChange(value) {
  var total = Array.isArray(desafiosAtivosCarouselItems) ? desafiosAtivosCarouselItems.length : 0;
  if (!total) {
    atualizarSeletorDesafioRanking();
    return;
  }

  var indiceSelecionado = Number(value);
  if (!Number.isInteger(indiceSelecionado)) {
    atualizarSeletorDesafioRanking();
    return;
  }

  if (indiceSelecionado < 0 || indiceSelecionado >= total) {
    atualizarSeletorDesafioRanking();
    return;
  }

  var novoIndice = indiceSelecionado;
  if (novoIndice === desafiosAtivosCarouselIndex) return;

  perfStart('trocaRankingDesafio');

  desafiosAtivosCarouselIndex = novoIndice;
  desafioEmFocoKey = getDesafioKey(desafiosAtivosCarouselItems[desafiosAtivosCarouselIndex]);
  salvarDesafioEmFocoNaSessao(desafioEmFocoKey);

  renderDesafioEmFocoResumo();
  sincronizarPainelComDesafioEmFoco();
  carregarRanking('manual');
  perfEnd('trocaRankingDesafio');
}

function renderDesafiosLista(containerId, lista, options) {
  var box = document.getElementById(containerId);
  if (!box) return;

  options = options || {};
  box.innerHTML = '';

  var itens = Array.isArray(lista) ? lista.slice() : [];
  if (options.principalRef) {
    itens = itens.filter(function(item) {
      return !isMesmoDesafio(item, options.principalRef);
    });
  }

  if (!itens.length) {
    var titulo = options.emptyTitle || 'Nenhum desafio para exibir.';
    var descricao = options.emptyDescription || 'Novos desafios serão exibidos aqui assim que estiverem disponíveis.';
    box.innerHTML =
      '<div class="atividade atividade-empty desafio-empty">' +
        '<strong>' + escapeHtml(titulo) + '</strong>' +
        '<p>' + escapeHtml(descricao) + '</p>' +
      '</div>';
    return;
  }

  itens.forEach(function(item) {
    box.appendChild(buildDesafioCard(item, options));
  });
}

function buildDesafioCard(item, options) {
  var desafio = item || {};
  var card = document.createElement('div');
  options = options || {};

  var statusLabel = String(desafio.status_apuracao || '-').trim() || '-';
  var statusClass = getDesafioStatusClass(statusLabel);
  var percentualNumero = toFiniteNumber(desafio.percentual_concluido, 0);
  var percentualNormalizado = Math.max(0, Math.min(100, percentualNumero));

  var selecionado = getDesafioKey(desafio) === String(desafioEmFocoKey || '').trim();
  card.className = (options.isPrincipal ? 'card desafio-principal-card ' : 'atividade ') + 'desafio-resumo-card ' + statusClass + (options.isHistorico ? ' desafio-resumo-card-historico' : '') + (selecionado ? ' desafio-resumo-card-selecionado' : '');

  var nome = getDesafioTitulo(desafio);
  var meta = formatNumber(desafio.meta_km);
  var realizado = formatNumber(desafio.distancia_realizada);
  var percentual = formatNumber(percentualNormalizado);
  var restante = formatNumber(Math.max(0, toFiniteNumber(desafio.meta_km, 0) - toFiniteNumber(desafio.distancia_realizada, 0)));
  var periodoLabel = getDesafioPeriodoLabel(desafio);
  var podeBaixarCertificado = isDesafioElegivelCertificado_(desafio);
  var mensagemCertificado = getMensagemCertificado_(desafio);
  var mensagemLocalCertificado = mensagemCertificado.texto;
  var varianteLocalCertificado = mensagemCertificado.variante;

  card.innerHTML =
    '<div class="desafio-resumo-head">' +
      '<div class="desafio-resumo-title-wrap">' +
        '<strong class="desafio-resumo-titulo">' + escapeHtml(nome) + '</strong>' +
        (selecionado && !options.hideSelectedBadge ? '<span class="desafio-selecionado-badge">Selecionado · Em foco</span>' : '') +
      '</div>' +
      '<span class="desafio-status-badge">' + escapeHtml(statusLabel) + '</span>' +
    '</div>' +
    '<div class="desafio-metricas-grid">' +
      '<p><span>Meta</span><strong' + (options.isPrincipal ? ' id="meta-km"' : '') + '>' + meta + '</strong> km</p>' +
      '<p><span>Realizado</span><strong' + (options.isPrincipal ? ' id="realizado-km"' : '') + '>' + realizado + '</strong> km</p>' +
      '<p><span>Falta</span><strong' + (options.isPrincipal ? ' id="restante-km"' : '') + '>' + restante + '</strong> km</p>' +
      '<p><span>Conclusão</span><strong' + (options.isPrincipal ? ' id="progress-percent"' : '') + '>' + percentual + '%</strong></p>' +
    '</div>' +
    '<p class="desafio-periodo"><span>Período</span> <strong>' + escapeHtml(periodoLabel) + '</strong></p>' +
    '<div class="desafio-progress-track" aria-hidden="true"><span' + (options.isPrincipal ? ' id="progress-bar"' : '') + ' class="desafio-progress-fill" style="width:' + percentualNormalizado + '%"></span></div>' +
    (options.isPrincipal ? '<p id="progress-text" class="desafio-progress-text">' + realizado + ' km de ' + meta + ' km</p>' : '') +
    (options.allowSelect
      ? '<div class="atividade-acoes"><button type="button" class="btn-secondary atividade-acao-btn" onclick="selecionarDesafioEmFoco(\'' + escapeHtml(getDesafioKey(desafio)) + '\')"' + (selecionado ? ' disabled aria-current="true"' : '') + '>' + (selecionado ? 'Em foco' : 'Selecionar') + '</button></div>'
      : '') +
    (podeBaixarCertificado
      ? buildCertificadoDesafioHtml_(desafio, options.isPrincipal ? 'painel-principal' : 'painel-lista')
      : '') +
    (podeBaixarCertificado ? '' : '<div class="msg status-msg certificado-status-local' + (mensagemLocalCertificado ? ' is-visible msg-inline' : '') + (varianteLocalCertificado ? (' msg-' + varianteLocalCertificado) : '') + '">' + escapeHtml(mensagemLocalCertificado) + '</div>');

  return card;
}

function buildCertificadoDesafioHtml_(desafio, contexto, options) {
  options = options || {};
  var payloadCertificado = encodeURIComponent(JSON.stringify({
    id_inscricao: desafio.id_inscricao || '',
    id_desafio: desafio.id_desafio || '',
    id_item_estoque: desafio.id_item_estoque || ''
  }));
  var prefixo = String(contexto || 'certificado');
  var certificadoStatusId = buildDesafioCertificadoDomId(prefixo + '-status', desafio);
  var certificadoBtnId = buildDesafioCertificadoDomId(prefixo + '-btn', desafio);
  var certificadoImagemAcoesId = buildDesafioCertificadoDomId(prefixo + '-imagem-acoes', desafio);
  var mensagemCertificado = getMensagemCertificado_(desafio);

  return '<div class="atividade-acoes"><button type="button" id="' + certificadoBtnId + '" class="btn-secondary atividade-acao-btn certificado-download-btn" onclick="solicitarCertificadoDesafio(\'' + payloadCertificado + '\', \'' + certificadoStatusId + '\', \'' + certificadoBtnId + '\', \'' + certificadoImagemAcoesId + '\')">Baixar certificado</button></div>' +
    '<div id="' + certificadoImagemAcoesId + '" class="atividade-acoes" style="display:none;">' +
      '<button type="button" class="btn-secondary atividade-acao-btn" onclick="baixarPdfCertificadoDesafio(\'' + payloadCertificado + '\')">Baixar PDF</button>' +
      '<button type="button" class="btn-secondary atividade-acao-btn" onclick="baixarImagemCertificadoDesafio(\'' + payloadCertificado + '\')">Baixar imagem</button>' +
    '</div>' +
    (options.ocultarMensagemInicial ? '<div id="' + certificadoStatusId + '" class="msg status-msg certificado-status-local"></div>' : '<div id="' + certificadoStatusId + '" class="msg status-msg certificado-status-local is-visible msg-inline msg-' + escapeHtml(mensagemCertificado.variante || 'success') + '">' + escapeHtml(mensagemCertificado.texto) + '</div>');
}

function getDesafioStatusClass(status) {
  var normalizado = String(status || '').trim().toUpperCase();
  if (normalizado === 'ATIVO') return 'desafio-status-ativo';
  if (normalizado === 'CONCLUIDO') return 'desafio-status-concluido';
  if (normalizado === 'EXPIRADO') return 'desafio-status-expirado';
  if (normalizado === 'INAPTO') return 'desafio-status-inapto';
  return 'desafio-status-neutro';
}

function normalizarListaDesafiosPainel_(lista) {
  if (!Array.isArray(lista) || !lista.length) return [];
  var out = [];
  var vistos = {};
  for (var i = 0; i < lista.length; i++) {
    var item = lista[i];
    var chave = getDesafioBaseKey_(item);
    if (!chave || vistos[chave]) continue;
    vistos[chave] = true;
    out.push(item);
  }
  return out;
}

function getDesafioBaseKey_(desafio) {
  if (!desafio) return '';
  var idInscricao = String(desafio.id_inscricao || '').trim();
  var idDesafio = String(desafio.id_desafio || '').trim();
  var idItem = String(desafio.id_item_estoque || '').trim();
  var inicio = String(desafio.periodo_inicio || '').trim();
  var fim = String(desafio.periodo_fim || '').trim();
  var meta = String(desafio.meta_km || '').trim();
  if (idInscricao) return 'INSCRICAO|' + idInscricao;
  if (!idDesafio && !idItem) return '';
  return [idDesafio, idItem, inicio, fim, meta].join('|');
}

function mapearChavesDesafiosBase_(lista) {
  var map = {};
  var itens = Array.isArray(lista) ? lista : [];
  for (var i = 0; i < itens.length; i++) {
    var chave = getDesafioBaseKey_(itens[i]);
    if (chave) map[chave] = true;
  }
  return map;
}

function isDesafioAtivo_(desafio) {
  return String((desafio && desafio.status_apuracao) || '').trim().toUpperCase() === 'ATIVO';
}

function isDesafioHistoricoElegivel_(desafio) {
  var status = String((desafio && desafio.status_apuracao) || '').trim().toUpperCase();
  var statusHistorico = {
    CONCLUIDO: true,
    EXPIRADO: true,
    CANCELADO: true,
    DESISTENTE: true,
    ENCERRADO: true
  };
  return !!statusHistorico[status];
}

function isDesafioElegivelCertificado_(desafio) {
  if (!desafio) return false;
  var statusApuracao = String(desafio.status_apuracao || '').trim().toUpperCase();
  var statusUsuarioDesafio = String(desafio.status_usuario_desafio || '').trim().toUpperCase();
  return statusApuracao === 'CONCLUIDO' &&
    statusUsuarioDesafio === 'CONCLUIDO';
}

function getMensagemCertificado_(desafio) {
  var item = desafio || {};
  var statusApuracao = String(item.status_apuracao || '').trim().toUpperCase();
  var statusUsuarioDesafio = String(item.status_usuario_desafio || '').trim().toUpperCase();

  if (statusUsuarioDesafio === 'CANCELADO') {
    return { texto: 'Inscrição cancelada.', variante: '' };
  }
  if (statusApuracao === 'EXPIRADO' && statusUsuarioDesafio === 'NAO_CONCLUIDO') {
    return { texto: 'Desafio encerrado sem conclusão da meta.', variante: '' };
  }
  if (statusApuracao !== 'CONCLUIDO') {
    return { texto: 'Conclua sua meta para liberar seu certificado.', variante: '' };
  }
  if (statusUsuarioDesafio !== 'CONCLUIDO') {
    return { texto: 'Meta atingida. Aguardando validação da organização.', variante: 'loading' };
  }
  return { texto: 'Certificado disponível.', variante: 'success' };
}

function solicitarCertificadoDesafio(payloadEncoded, localStatusId, buttonId, imageActionsId) {
  var payload = {};
  try {
    payload = JSON.parse(decodeURIComponent(String(payloadEncoded || '')));
  } catch (e) {
    payload = {};
  }

  var idDgmb = currentUser && currentUser.id_dgmb ? String(currentUser.id_dgmb).trim() : '';
  var certificadoKey = buildCertificadoProcessKey_(payload);
  if (isConquistaActionLocked_()) {
    setPainelMsg('Aguarde: outro certificado está sendo processado.', 'loading');
    setCertificadoLocalMsg(localStatusId, 'Aguarde a geração do certificado em andamento.', 'loading');
    return;
  }
  if (!idDgmb) {
    setPainelMsg('Sessão inválida. Entre novamente para baixar seu certificado.', 'error');
    setCertificadoLocalMsg(localStatusId, 'Sessão inválida. Entre novamente para baixar seu certificado.', 'error');
    return;
  }

  certificadoProcessandoKey = certificadoKey;
  setGlobalLoadingMessage('Gerando certificado...');
  syncGlobalBusyState();
  setConquistaActionLock_(true);
  setCertificadoProcessingState_(true, buttonId);

  setPainelMsg('Gerando certificado...', 'loading');
  setCertificadoLocalMsg(localStatusId, 'Gerando seu certificado...', 'loading');
  google.script.run
    .withSuccessHandler(function(res) {
      certificadoProcessandoKey = '';
      syncGlobalBusyState();
      liberarConquistaActionLock_();
      setCertificadoProcessingState_(false);

      if (!res || res.ok !== true || !(res.pdfDownloadUrl || res.url)) {
        if (res && (res.code === 'CONCLUSAO_ADMINISTRATIVA_PENDENTE' || res.code === 'CERTIFICADO_EM_PROCESSAMENTO')) {
          setPainelMsg(res.msg, 'loading');
          setCertificadoLocalMsg(localStatusId, res.msg, 'loading');
          return;
        }
        var mensagemErro = (res && res.msg) ? res.msg : 'Não foi possível gerar o certificado agora.';
        setPainelMsg(mensagemErro, 'error');
        setCertificadoLocalMsg(localStatusId, mensagemErro, 'error');
        return;
      }
      setPainelMsg(res.reused ? 'Certificado pronto para download.' : 'Certificado gerado com sucesso.', 'success', 2600);
      setCertificadoLocalMsg(localStatusId, 'Certificado pronto para download.', 'success');
      atualizarAcoesImagemCertificado_(payload, imageActionsId, res);
    })
    .withFailureHandler(function() {
      certificadoProcessandoKey = '';
      syncGlobalBusyState();
      liberarConquistaActionLock_();
      setCertificadoProcessingState_(false);
      setPainelMsg('Erro de conexão ao gerar certificado.', 'error');
      setCertificadoLocalMsg(localStatusId, 'Não foi possível gerar seu certificado agora. Tente novamente.', 'error');
    })
    .gerarOuObterCertificadoDesafio({
      id_inscricao: payload.id_inscricao || '',
      id_dgmb: idDgmb,
      id_desafio: payload.id_desafio || '',
      id_item_estoque: payload.id_item_estoque || ''
    });
}

function buildCertificadoProcessKey_(payload) {
  var item = payload || {};
  return [
    String(item.id_inscricao || '').trim(),
    String(item.id_desafio || '').trim(),
    String(item.id_item_estoque || '').trim()
  ].join('|');
}

function setCertificadoProcessingState_(processing, activeButtonId) {
  syncConquistasBloqueioVisual_();
  var buttons = document.querySelectorAll('.certificado-download-btn');
  buttons.forEach(function(button) {
    button.disabled = !!processing;
    if (processing && button.id === String(activeButtonId || '')) {
      button.dataset.originalText = button.dataset.originalText || button.innerText;
      button.innerText = 'Gerando...';
    } else if (!processing && button.dataset.originalText) {
      button.innerText = button.dataset.originalText;
      delete button.dataset.originalText;
    }
  });
}

function atualizarAcoesImagemCertificado_(payload, imageActionsId, res) {
  var key = buildCertificadoDesafioKey_(payload);
  if (!key) return;

  var imageUrl = String((res && res.imageUrl) || '').trim();
  var pdfDownloadUrl = String((res && res.pdfDownloadUrl) || '').trim() || String((res && res.url) || '').trim();
  if (!imageUrl && !pdfDownloadUrl) return;

  certificadoImagemLinks_[key] = {
    imageUrl: imageUrl,
    pdfDownloadUrl: pdfDownloadUrl,
    downloadImageUrl: String((res && res.downloadImageUrl) || '').trim() || imageUrl
  };

  var box = document.getElementById(String(imageActionsId || ''));
  if (!box) return;
  box.style.display = '';
}

function baixarPdfCertificadoDesafio(payloadEncoded) {
  var payload = {};
  try {
    payload = JSON.parse(decodeURIComponent(String(payloadEncoded || '')));
  } catch (e) {
    payload = {};
  }

  var key = buildCertificadoDesafioKey_(payload);
  var links = key ? certificadoImagemLinks_[key] : null;
  var pdfUrl = String((links && links.pdfDownloadUrl) || '').trim();
  if (!pdfUrl) {
    setPainelMsg('Primeiro gere o certificado.', 'error');
    return;
  }

  abrirCertificadoUrlRobusto_(pdfUrl);
}

function baixarImagemCertificadoDesafio(payloadEncoded) {
  // PENDÊNCIA: Botão “Baixar imagem” do certificado não está funcionando e será tratado em missão separada.
  var payload = {};
  try {
    payload = JSON.parse(decodeURIComponent(String(payloadEncoded || '')));
  } catch (e) {
    payload = {};
  }

  var key = buildCertificadoDesafioKey_(payload);
  var links = key ? certificadoImagemLinks_[key] : null;
  if (!links || !links.imageUrl) {
    setPainelMsg('Primeiro gere o certificado.', 'error');
    return;
  }

  var downloadUrl = String((links && links.downloadImageUrl) || '').trim();
  var fallbackUrl = String((links && links.imageUrl) || '').trim();
  var url = downloadUrl || fallbackUrl;
  if (!url) {
    setPainelMsg('Primeiro gere o certificado.', 'error');
    return;
  }

  var baixou = false;
  try {
    var a = document.createElement('a');
    a.href = url;
    a.download = '';
    a.rel = 'noopener noreferrer';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    baixou = true;
  } catch (e3) {
    baixou = false;
  }

  if (!baixou) {
    abrirCertificadoUrlRobusto_(url);
  }
}

function abrirCertificadoUrlRobusto_(url) {
  var safeUrl = String(url || '').trim();
  if (!safeUrl) return false;

  try {
    var novaAba = window.open(safeUrl, '_blank', 'noopener,noreferrer');
    if (novaAba && !novaAba.closed) return true;
  } catch (e) {}

  try {
    var a = document.createElement('a');
    a.href = safeUrl;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    return true;
  } catch (e2) {}

  return false;
}

function compareDesafioHistorico_(a, b) {
  var fimA = String((a && a.periodo_fim) || '').trim();
  var fimB = String((b && b.periodo_fim) || '').trim();
  if (fimA !== fimB) return fimB.localeCompare(fimA);

  var inicioA = String((a && a.periodo_inicio) || '').trim();
  var inicioB = String((b && b.periodo_inicio) || '').trim();
  if (inicioA !== inicioB) return inicioB.localeCompare(inicioA);

  var nomeA = String((a && (a.nome_desafio || a.nome || a.titulo)) || '').trim();
  var nomeB = String((b && (b.nome_desafio || b.nome || b.titulo)) || '').trim();
  return nomeA.localeCompare(nomeB);
}

function isMesmoDesafio(a, b) {
  if (!a || !b) return false;
  var chaveA = [String(a.id_desafio || '').trim(), String(a.id_item_estoque || '').trim()].join('|');
  var chaveB = [String(b.id_desafio || '').trim(), String(b.id_item_estoque || '').trim()].join('|');
  return chaveA && chaveA === chaveB;
}

function getDesafioTitulo(desafio) {
  var nome = String(
    (desafio && (
      desafio.nome_desafio ||
      desafio.nome ||
      desafio.titulo ||
      desafio.desafio_nome ||
      desafio.identificacao
    )) || ''
  ).trim();

  if (nome) return nome;

  var idDesafio = String((desafio && desafio.id_desafio) || '').trim();
  var idItem = String((desafio && desafio.id_item_estoque) || '').trim();

  if (idItem && idDesafio) return 'Desafio ' + idDesafio + ' · Item ' + idItem;
  if (idItem) return 'Item ' + idItem;
  if (idDesafio) return 'Desafio ' + idDesafio;
  return 'Desafio sem identificação';
}

function getActivityDateParts_(value) {
  var raw = String(value || '').trim();
  var match = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (match) {
    return {
      year: match[1],
      month: match[2],
      day: match[3],
      key: match[1] + '-' + match[2]
    };
  }

  match = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (match) {
    return {
      year: match[3],
      month: match[2],
      day: match[1],
      key: match[3] + '-' + match[2]
    };
  }

  return null;
}

function getMesNome_(month) {
  var nomes = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var index = Number(month) - 1;
  return nomes[index] || '';
}

function getMesLabel_(key) {
  var partes = String(key || '').split('-');
  if (partes.length < 2) return '';
  var nome = getMesNome_(partes[1]);
  return nome ? nome + '/' + partes[0] : key;
}

function getActivityMonthKey_(item) {
  var partes = getActivityDateParts_(item && item.data);
  return partes ? partes.key : '';
}

function getActivityDayLabel_(item) {
  var partes = getActivityDateParts_(item && item.data);
  if (partes && partes.day) return String(Number(partes.day));
  return formatDateBR(item && item.data);
}

function montarMesesAtividades_(lista) {
  var mapa = {};
  (Array.isArray(lista) ? lista : []).forEach(function(item) {
    var key = getActivityMonthKey_(item);
    if (key) mapa[key] = true;
  });
  return Object.keys(mapa).sort().reverse();
}

function selecionarMesAtividades(key) {
  atividadesMesAtivo = String(key || '').trim();
  renderAtividades(currentPainel && currentPainel.atividades || []);
}

function renderAtividades(lista) {
  const box = document.getElementById('atividades-lista');
  const mesesBox = document.getElementById('atividades-meses');
  const resumo = document.getElementById('atividades-mes-resumo');
  if (!box) return;

  clearRecentActivityHighlight();
  box.innerHTML = '';

  var atividades = Array.isArray(lista) ? lista.slice() : [];
  var meses = montarMesesAtividades_(atividades);

  if (!atividades.length) {
    if (mesesBox) mesesBox.innerHTML = '';
    if (resumo) resumo.innerHTML = '';
    renderAtividadesState('empty', 'Você ainda não registrou atividades.', 'Assim que você registrar um pedal, a lista aparecerá aqui.');
    return;
  }

  if (!atividadesMesAtivo || meses.indexOf(atividadesMesAtivo) === -1) {
    atividadesMesAtivo = meses[0] || '';
  }

  if (mesesBox) {
    mesesBox.innerHTML = '';
    meses.forEach(function(key) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'atividades-mes-btn' + (key === atividadesMesAtivo ? ' is-active' : '');
      btn.innerText = getMesLabel_(key);
      btn.setAttribute('aria-pressed', key === atividadesMesAtivo ? 'true' : 'false');
      btn.onclick = function() { selecionarMesAtividades(key); };
      mesesBox.appendChild(btn);
    });
  }

  var listaFiltrada = atividades.filter(function(item) {
    return getActivityMonthKey_(item) === atividadesMesAtivo;
  });
  var totalMes = listaFiltrada.reduce(function(total, item) {
    return total + toFiniteNumber(item && item.km, 0);
  }, 0);

  if (resumo) {
    resumo.innerHTML = '<span>Total do mês: <strong id="total-pedalado">' + formatNumber(totalMes) + '</strong> km</span>';
  }

  if (!listaFiltrada.length) {
    renderAtividadesState('empty', 'Nenhuma atividade registrada neste mês.', 'Escolha outro mês ou registre uma nova atividade.');
    return;
  }

  const highlightedItem = findRecentActivityHighlightMatch(listaFiltrada);

  listaFiltrada.forEach(function(item) {
    item = item || {};
    const div = document.createElement('div');
    div.className = 'atividade';
    if (item.activity_id) div.setAttribute('data-activity-id', String(item.activity_id).trim());
    if (item.chave_edicao) div.setAttribute('data-chave-edicao', String(item.chave_edicao).trim());

    const info = document.createElement('div');
    info.className = 'atividade-info';
    info.innerText = 'Dia ' + getActivityDayLabel_(item) + ' — ' + formatNumber(item.km) + ' km';
    div.appendChild(info);

    const actions = document.createElement('div');
    actions.className = 'atividade-acoes';

    const btnEditar = document.createElement('button');
    btnEditar.type = 'button';
    btnEditar.className = 'btn-secondary atividade-acao-btn';
    btnEditar.innerText = 'Editar';
    const editKey = String(item.activity_id || '').trim() || String(item.chave_edicao || '').trim();
    if (editKey) {
      if (activeEditKey && activeEditKey !== editKey) btnEditar.disabled = true;
      if (activeEditKey && activeEditKey === editKey) {
        btnEditar.disabled = true;
        btnEditar.innerText = 'Editando';
      }
      btnEditar.onclick = function() { iniciarEdicaoAtividadeUI(item); };
    } else {
      btnEditar.disabled = true;
    }

    const btnExcluir = document.createElement('button');
    btnExcluir.type = 'button';
    btnExcluir.className = 'btn-secondary atividade-acao-btn';
    btnExcluir.innerText = 'Excluir';
    const deleteKey = String(item.activity_id || '').trim() || String(item.chave_edicao || '').trim();
    if (deleteKey) {
      btnExcluir.onclick = function() { excluirAtividadeUI(item, btnExcluir); };
    } else {
      btnExcluir.disabled = true;
    }

function getGoogleScriptErrorMessage(err, fallback) {
  const fallbackText = String(fallback || 'Erro inesperado.').trim() || 'Erro inesperado.';

  if (typeof err === 'string') {
    const text = err.trim();
    if (text) return 'string: ' + text;
    return fallbackText;
  }

  if (err && typeof err === 'object') {
    const parts = [];

    parts.push('type=' + typeof err);

    const fields = ['name', 'message', 'msg', 'details', 'error', 'stack'];
    for (var i = 0; i < fields.length; i++) {
      const key = fields[i];
      const value = err[key];
      if (value === undefined || value === null) continue;
      const text = String(value).trim();
      if (!text || text === '[object Object]' || text.toLowerCase() === 'undefined') continue;
      parts.push(key + '=' + text);
    }

    try {
      const keys = Object.keys(err);
      if (keys && keys.length) {
        parts.push('keys=' + keys.join(','));
      }
    } catch (keysErr) {}

    try {
      const serialized = JSON.stringify(err);
      if (serialized && serialized !== '{}' && serialized !== '[]') {
        parts.push('json=' + serialized);
      }
    } catch (jsonErr) {}

    if (parts.length) {
      return parts.join(' | ');
    }
  }

  return fallbackText;
}

function toFiniteNumber(value, fallback) {
  const n = Number(value);
  return Number.isFinite(n) ? n : Number(fallback || 0);
}

function isValidActivityDate(value) {
  const parsed = parseIsoDateLocal(value);
  if (!parsed) return false;

  const match = String(value || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!match) return false;

  return parsed.getFullYear() === Number(match[1])
    && (parsed.getMonth() + 1) === Number(match[2])
    && parsed.getDate() === Number(match[3]);
}

function parseValidActivityKm(value) {
  const raw = String(value || '').trim();
  const sanitized = sanitizeKmInputValue(raw);
  if (!sanitized || sanitized !== raw) return null;
  if (!/^\d+(?:[.,]\d+)?$/.test(sanitized)) return null;

  const numeric = Number(sanitized.replace(',', '.'));
  if (!Number.isFinite(numeric) || numeric <= 0) return null;
  return numeric;
}

function atualizarPainelAposAtividade() {
  return new Promise(function(resolve, reject) {
    let finalizado = false;
    const timeout = window.setTimeout(function() {
      if (finalizado) return;
      finalizado = true;
      reject(new Error('Tempo limite ao atualizar o painel.'));
    }, 60000);

    function aguardarAtualizacao() {
      if (finalizado) return;
      if (!painelLoadInProgress && !painelReloadPending) {
        finalizado = true;
        window.clearTimeout(timeout);
        window.requestAnimationFrame(function() {
          window.requestAnimationFrame(resolve);
        });
        return;
      }
      window.setTimeout(aguardarAtualizacao, 80);
    }

    carregarPainelPosSalvarLeve(true);
    window.setTimeout(aguardarAtualizacao, 0);
  });
}

function getRankingCacheKey(desafio) {
  desafio = desafio || getDesafioEmFocoAtual() || {};
  var idInscricao = String(desafio.id_inscricao || '').trim();
  if (idInscricao) return idInscricao;

  var idDesafio = String(desafio.id_desafio || '').trim();
  var idItemEstoque = String(desafio.id_item_estoque || '').trim();
  return idDesafio + '|' + idItemEstoque;
}

function getRankingCacheValido(cacheKey) {
  var item = cacheKey ? rankingCachePorDesafio[cacheKey] : null;
  if (!item || !item.timestamp) return null;
  if (Date.now() - item.timestamp > RANKING_CACHE_TTL_MS) return null;
  return item;
}

function salvarRankingCache(cacheKey, lista, idInscricaoReferencia) {
  if (!cacheKey) return;
  rankingCachePorDesafio[cacheKey] = {
    timestamp: Date.now(),
    lista: Array.isArray(lista) ? lista.slice() : [],
    id_inscricao_referencia: String(idInscricaoReferencia || '').trim()
  };
}

function invalidarCacheRanking(cacheKey) {
  if (cacheKey) {
    delete rankingCachePorDesafio[cacheKey];
    perfLog('rankingCacheInvalidado', cacheKey);
    return;
  }
  Object.keys(rankingCachePorDesafio).forEach(function(key) {
    delete rankingCachePorDesafio[key];
  });
  perfLog('rankingCacheInvalidado', 'todos');
}

function carregarRanking(triggerSource) {
  var rankingPerfLabel = 'carregarRanking' + (triggerSource ? ':' + triggerSource : '');
  perfStart(rankingPerfLabel);
  const idDgmb = currentUser && currentUser.id_dgmb ? String(currentUser.id_dgmb).trim() : '';
  const desafioAtual = getDesafioEmFocoAtual();
  atualizarCabecalhoTelaRanking(desafioAtual);
  const desafioRequestKey = getDesafioKey(desafioAtual);
  const rankingCacheKey = getRankingCacheKey(desafioAtual);
  const rankingCache = getRankingCacheValido(rankingCacheKey);

  if (rankingCache) {
    showScreen('ranking');
    renderRanking(rankingCache.lista, rankingCache.id_inscricao_referencia);
    setRankingMsg('Acompanhamento atualizado recentemente.', 'success', 2200);
    perfEnd(rankingPerfLabel);
    return;
  }

  if (rankingLoadInProgress) {

    rankingReloadPending = true;
    if (triggerSource === 'manual') {
      setPainelMsg('Atualizando ranking do desafio em foco...', 'loading');
    }
    setRankingMsg('Atualizando ranking do desafio em foco...', 'loading');
    return;
  }

  rankingLoadInProgress = true;
  setGlobalLoadingMessage('Carregando ranking...');
  rankingReloadPending = false;
  rankingLoadRequestId += 1;
  const requestId = rankingLoadRequestId;
  syncGlobalBusyState();
  setRankingLoadDisabled(true);
  showScreen('ranking');
  setRankingMsg('Atualizando ranking do desafio em foco...', 'loading');
  renderRankingState('loading', 'Atualizando ranking do desafio em foco', 'Estamos preparando a lista com os participantes e as quilometragens registradas.');

  try {
    google.script.run
      .withSuccessHandler(function(res) {
        try {
          if (requestId !== rankingLoadRequestId) {
            return;
          }

          if (!res || !res.ok) {
            setRankingMsg((res && res.msg) ? res.msg : 'Erro ao carregar ranking.', 'error');
            renderRankingState('error', 'Não foi possível carregar o acompanhamento.', 'Tente novamente em instantes para atualizar a lista.');
            return;
          }

          var rankingListaNova = Array.isArray(res.data) ? res.data : [];
          var rankingInscricaoNova = String((res && res.id_inscricao_referencia) || (desafioAtual && desafioAtual.id_inscricao) || '').trim();
          salvarRankingCache(rankingCacheKey, rankingListaNova, rankingInscricaoNova);
          setRankingMsg('Acompanhamento atualizado com sucesso. Confira sua jornada abaixo.', 'success', 2600);
          renderRanking(
            rankingListaNova,
            rankingInscricaoNova
          );
          showRankingLoadSuccessFeedback();
        } catch (errSuccess) {
          setRankingMsg('Erro ao processar ranking.', 'error');
          renderRankingState('error', 'Não foi possível carregar o acompanhamento.', 'Tente novamente em instantes para atualizar a lista.');
          console.error(errSuccess);
        } finally {
          if (requestId !== rankingLoadRequestId) {
            return;
          }
          rankingLoadInProgress = false;
          perfEnd(rankingPerfLabel);
          syncGlobalBusyState();
          setRankingLoadDisabled(false);
          if (rankingReloadPending || desafioRequestKey !== getDesafioKey(getDesafioEmFocoAtual())) {
            carregarRanking('manual');
          }
        }
      })
      .withFailureHandler(function(err) {
        if (requestId !== rankingLoadRequestId) {
          return;
        }
        rankingLoadInProgress = false;
        perfEnd(rankingPerfLabel);
        syncGlobalBusyState();
        setRankingLoadDisabled(false);
        setRankingMsg('Erro ao carregar ranking.', 'error');
        renderRankingState('error', 'Não foi possível carregar o acompanhamento.', 'Confira sua conexão e tente novamente em instantes.');
        console.error(err);
        if (rankingReloadPending || desafioRequestKey !== getDesafioKey(getDesafioEmFocoAtual())) {
          carregarRanking('manual');
        }
      })
      .getRanking(
        idDgmb,
        desafioAtual && desafioAtual.id_desafio,
        desafioAtual && desafioAtual.id_item_estoque,
        desafioAtual && desafioAtual.id_inscricao
      );
  } catch (errRun) {
    if (requestId !== rankingLoadRequestId) {
      return;
    }
    rankingLoadInProgress = false;
    perfEnd(rankingPerfLabel);
    syncGlobalBusyState();
    setRankingLoadDisabled(false);
    setRankingMsg('Erro ao carregar ranking.', 'error');
    renderRankingState('error', 'Não foi possível carregar o acompanhamento.', 'Confira sua conexão e tente novamente em instantes.');
    console.error(errRun);
    if (rankingReloadPending || desafioRequestKey !== getDesafioKey(getDesafioEmFocoAtual())) {
      carregarRanking('manual');
    }
  }
}

function getRankingProgressInfo(item) {
  item = item || {};
  var meta = toFiniteNumber(item.meta, 0);
  var realizado = toFiniteNumber(item.realizado !== undefined ? item.realizado : item.distancia_realizada, 0);
  var percentual = toFiniteNumber(item.percentual !== undefined ? item.percentual : item.percentual_concluido, 0);
  if (percentual <= 0 && meta > 0) percentual = (realizado / meta) * 100;
  var progressoBarra = Math.max(0, Math.min(100, percentual));
  var restante = item.restante !== undefined ? toFiniteNumber(item.restante, 0) : Math.max(meta - realizado, 0);
  var concluido = meta > 0 && (realizado >= meta || percentual >= 100 || restante <= 0);
  var semRegistro = realizado <= 0 && percentual <= 0;
  return {
    meta: meta,
    realizado: realizado,
    percentual: percentual,
    progressoBarra: progressoBarra,
    restante: Math.max(restante, 0),
    concluido: concluido,
    semRegistro: semRegistro,
    statusClasse: concluido ? 'is-complete' : (semRegistro ? 'is-empty' : 'is-progress'),
    statusTexto: concluido ? 'Concluído' : (semRegistro ? 'Sem registro' : 'Em andamento')
  };
}

function isRankingItemCurrentUser(item, idInscricaoReferencia) {
  item = item || {};
  var currentUserId = currentUser && currentUser.id_dgmb ? String(currentUser.id_dgmb).trim() : '';
  var inscricaoEmFoco = String(idInscricaoReferencia || '').trim();
  var itemId = item.id_dgmb ? String(item.id_dgmb).trim() : '';
  var itemInscricao = item.id_inscricao ? String(item.id_inscricao).trim() : '';

  return inscricaoEmFoco
    ? !!itemInscricao && inscricaoEmFoco === itemInscricao
    : !!currentUserId && !!itemId && currentUserId === itemId;
}

function getRankingFilteredList(lista) {
  var filtro = rankingFiltroAtual || 'todos';
  if (filtro === 'todos') return lista;

  return lista.filter(function(item) {
    var info = getRankingProgressInfo(item);
    if (filtro === 'concluidos') return info.concluido;
    if (filtro === 'andamento') return info.realizado > 0 && !info.concluido;
    return true;
  });
}

function setRankingFilter(filtro) {

function buildRankingCardHtml(item, options) {
  item = item || {};

  return '' +
    '<div class="ranking-card-topline">' +
      '<span class="ranking-position">Posição atual: ' + escapeHtml(posicao) + '</span>' +

    '</div>' +

}

function renderRanking(lista, idInscricaoReferencia, preserveFilter) {
  const box = document.getElementById('ranking-lista');
  if (!box) return;

  if (!preserveFilter) {
    rankingListaAtual = Array.isArray(lista) ? lista : [];
    rankingInscricaoReferenciaAtual = String(idInscricaoReferencia || '').trim();
    rankingFiltroAtual = 'todos';
  }
  setRankingFilterButtonsState();

  box.innerHTML = '';
  const listaBase = Array.isArray(rankingListaAtual) ? rankingListaAtual : [];

  if (!listaBase.length) {
    renderRankingState('empty', 'Ainda não há atletas com km registrado.', 'Assim que as primeiras quilometragens forem lançadas, o acompanhamento do desafio aparecerá aqui.');
    return;
  }

  var usuario = null;
  listaBase.forEach(function(item) {
    if (!usuario && isRankingItemCurrentUser(item, rankingInscricaoReferenciaAtual)) usuario = item;
  });

  if (usuario) {
    var selfCard = document.createElement('section');
    selfCard.className = 'ranking-self-card ranking-item-self';
    selfCard.innerHTML = '<span class="ranking-section-label">Seu acompanhamento</span>' +
      buildRankingCardHtml(usuario, { isCurrentUser: true, index: usuario.posicao || usuario.posicao_ranking || '-' });
    box.appendChild(selfCard);
  }

  var filtrada = getRankingFilteredList(listaBase);
  var listaSection = document.createElement('section');
  listaSection.className = 'ranking-general-section';
  listaSection.innerHTML = '<div class="ranking-section-heading"><span class="ranking-section-label">Atletas em movimento</span><strong>Lista geral</strong></div>';

  var cardsWrap = document.createElement('div');
  cardsWrap.className = 'ranking-cards-grid';

  if (!filtrada.length) {
    cardsWrap.innerHTML = '<div class="atividade atividade-empty ranking-state ranking-state-empty"><div class="ranking-state-label">Filtro</div><strong>Nenhum atleta encontrado neste filtro.</strong><p>Escolha outra opção para continuar acompanhando a jornada.</p></div>';
  } else {
    filtrada.forEach(function(item, index) {
      var card = document.createElement('article');
      var isCurrentUser = isRankingItemCurrentUser(item, rankingInscricaoReferenciaAtual);
      card.className = 'ranking-athlete-card' + (isCurrentUser ? ' ranking-athlete-card-self' : '');
      card.innerHTML = buildRankingCardHtml(item, { isCurrentUser: isCurrentUser, index: index + 1 });
      cardsWrap.appendChild(card);
    });
  }

  listaSection.appendChild(cardsWrap);
  box.appendChild(listaSection);
}

function formatDateBR(value) {
  if (!value) return '';
  const s = String(value);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    const parts = s.split('-');
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }
  return s;
}

function formatNumber(value) {
  const n = toFiniteNumber(value, 0);
  if (Number.isInteger(n)) return String(n);
  return n.toFixed(1).replace('.', ',');
}

function escapeHtml(text) {
  return String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function atualizarStatusAdminValidacao(item, novoStatus, obsInputId) {
  if (!isAdminValidacaoUser()) {

    return;

  novoStatus = formatAdminStatusValidacao_(novoStatus);

  var card = obsInput ? obsInput.closest('.admin-cert-card') : null;
  var actionButtons = card ? Array.prototype.slice.call(card.querySelectorAll('[data-admin-action]')) : [];
  var clickedButton = null;
  for (var i = 0; i < actionButtons.length; i++) {
    if (actionButtons[i].getAttribute('data-admin-action') === novoStatus) {
      clickedButton = actionButtons[i];
      break;
    }
  }

  var observacao = obsInput ? String(obsInput.value || '').trim() : '';
  if (novoStatus === 'REPROVADO' && !observacao) {
    setAdminCertMsg('Informe uma observação para reprovar o certificado.', 'error');
    return;
  }

  setAdminActionButtonsBusy_(actionButtons, clickedButton, novoStatus, true);
  setAdminCertMsg('Atualizando validação...', 'loading');
  var payloadAtualizacao = {
    admin_id_dgmb: String(currentUser.id_dgmb || '').trim(),
    id_inscricao: item.id_inscricao || '',
    id_dgmb: item.id_dgmb || '',
    id_desafio: item.id_desafio || '',
    id_item_estoque: item.id_item_estoque || '',
    row_number: item.row_number || '',
    novo_status: novoStatus,
    observacao: observacao
  };
  console.log('[ADMIN_CERT][ATUALIZAR][PAYLOAD]', payloadAtualizacao);

  google.script.run
    .withSuccessHandler(function(res) {
      console.log('[ADMIN_CERT][ATUALIZAR][RESPOSTA]', res);
      setAdminActionButtonsBusy_(actionButtons, clickedButton, novoStatus, false);
      if (!res || res.ok !== true) {
        setAdminCertMsg((res && res.msg) ? res.msg : 'Não foi possível atualizar o status.', 'error');
        return;

      carregarAdminValidacaoPendencias();

function formatAdminStatusValidacao_(status) {
  var valor = String(status || '').trim().toUpperCase().replace(/\s+/g, '_');
  if (!valor) return 'PENDENTE';

  if (valor === 'EM_ANALISE') return 'EM_ANALISE';
  if (valor === 'APROVADO') return 'APROVADO';
  if (valor === 'REPROVADO') return 'REPROVADO';
  if (valor === 'PENDENTE') return 'PENDENTE';

  return 'PENDENTE';
}

function setAdminActionButtonsBusy_(buttons, clickedButton, status, isBusy) {
  var rotulosLoading = {
    EM_ANALISE: 'Salvando...',
    APROVADO: 'Aprovando...',
    REPROVADO: 'Reprovando...'
  };

  var lista = Array.isArray(buttons) ? buttons : [];
  for (var i = 0; i < lista.length; i++) {
    var btn = lista[i];
    if (!btn) continue;

    if (!btn.dataset.originalLabel) {
      btn.dataset.originalLabel = btn.textContent;
    }

    btn.disabled = !!isBusy;

    if (isBusy && clickedButton === btn) {
      btn.textContent = rotulosLoading[status] || 'Processando...';
      btn.classList.add('is-loading');
    } else {
      btn.textContent = btn.dataset.originalLabel;
      btn.classList.remove('is-loading');
    }
  }
}

function logoutUser() {
  limparSessaoLoginPersistida();
  salvarDesafioEmFocoNaSessao('');
  limparEstadoPainelPersistido();
  currentUser = null;
  currentPainel = null;
  rankingLoadInProgress = false;
  rankingReloadPending = false;
  phraseLoadInProgress = false;
  activityMutationInProgress = false;
  certificadoProcessandoKey = '';
  conquistaActionInProgress = false;
  painelLoadInProgress = false;
  painelReloadPending = false;
  clearRecentActivityHighlight();
  pendingRecentActivityHighlight = null;
  clearRankingPreviewFeedback();
  clearPhraseButtonTouchFeedback();
  if (registroCardFeedbackTimer) {
    clearTimeout(registroCardFeedbackTimer);
    registroCardFeedbackTimer = null;
  }
  syncGlobalBusyState();

  const painelIdInput = document.getElementById('painel-id-dgmb');
  if (painelIdInput) painelIdInput.value = '';

  const loginMsg = document.getElementById('login-msg');
  if (loginMsg) setTransientStatus('login-msg', '');

  const registroMsg = document.getElementById('registro-msg');
  if (registroMsg) setRegistroMsg('');
  setRegistroCardState('');

  setPainelMsg('');
  setRankingMsg('');
  setManualPainelRefreshDisabled(false);
  setRankingLoadDisabled(false);
  setPhraseButtonLoading(false);
  setActivityFormLocked(false);

  const cpfInput = document.getElementById('cpf');
  if (cpfInput) cpfInput.value = '';

  const dataInput = document.getElementById('data-atividade');
  if (dataInput) dataInput.value = '';

  const kmInput = document.getElementById('km-atividade');
  if (kmInput) kmInput.value = '';

  cancelarEdicaoAtividadeUI();

  syncAdminValidacaoVisibility();
  syncNavegacaoV2('inicio');
  showScreen('inicio');
}

function verOutraFrase() {
  novaFrase();
}

function addKm(value) {
  const input = document.getElementById('km-atividade');
  if (!input) return;

  input.value = sanitizeKmInputValue(input.value);
  const current = toFiniteNumber(readInputValue(input).replace(',', '.'), 0);
  const next = current + toFiniteNumber(value, 0);
  input.value = formatNumber(next);
}

function clearKm() {
  const input = document.getElementById('km-atividade');
  if (input) input.value = '';
}

function cancelarEdicaoAtividadeUI() {
  releaseRegistroSubmitGuard();
  releaseCancelEditTouchFeedback();
  activeEditKey = '';

  if (currentPainel && Array.isArray(currentPainel.atividades)) {
    sincronizarPainelComDesafioEmFoco();
  }

  const idInput = document.getElementById('atividade-id');
  if (idInput) idInput.value = '';

  const activityIdInput = document.getElementById('atividade-activity-id');
  if (activityIdInput) activityIdInput.value = '';

  const dataInput = document.getElementById('data-atividade');
  if (dataInput) dataInput.value = '';

  const kmInput = document.getElementById('km-atividade');
  if (kmInput) kmInput.value = '';

  const cancelBtn = document.getElementById('btn-cancelar-edicao');
  if (cancelBtn) cancelBtn.style.display = 'none';

  const saveBtn = document.getElementById('btn-salvar');
  if (saveBtn) {
    saveBtn.innerText = 'Registrar atividade';
    saveBtn.setAttribute('onclick', 'salvarAtividade(false)');
  }

  const registroMsg = document.getElementById('registro-msg');
  if (registroMsg) setRegistroMsg('');

  setRegistroCardState('reset');
}

</script>
