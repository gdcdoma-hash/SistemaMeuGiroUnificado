<script>
const SESSION_STORAGE_KEY = 'MEU_GIRO_CURRENT_USER';
const SERVER_SESSION_STORAGE_KEY = 'MEU_GIRO_SERVER_SESSION';
const PORTAL_GIRO_DEV_URL = 'https://script.google.com/macros/s/AKfycbxqA6LmqyTca8i9af5EWKOzuaibTDQKFa6Mtsht4jm7tR29iVZeohNZYLdc3WjNFFJA5Q/exec';
const PORTAL_EMBEDDED_MODE = new URLSearchParams(window.location.search || '').get('embedded') === '1';

function applyEmbeddedMode() {
  if (!PORTAL_EMBEDDED_MODE || !document.body) return;
  document.body.classList.add('portal-embedded-mode');
}

function saveUserSession(user) {
  try {
    if (!user || !user.id_dgmb) return;
    localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
      id_dgmb: String(user.id_dgmb || '').trim(),
      nome: String(user.nome || ''),
      cidade_uf: String(user.cidade_uf || '')
    }));
  } catch (err) { console.error('Erro ao salvar sessão:', err); }
}

function loadUserSession() {
  try {
    const raw = localStorage.getItem(SESSION_STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.id_dgmb) return null;
    return { id_dgmb: String(parsed.id_dgmb || '').trim(), nome: String(parsed.nome || ''), cidade_uf: String(parsed.cidade_uf || '') };
  } catch (err) { console.error('Erro ao carregar sessão:', err); return null; }
}

function clearUserSession() {
  try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (err) { console.error('Erro ao limpar sessão:', err); }
}

function saveServerSession(token, expiraEm) {
  try {
    localStorage.setItem(SERVER_SESSION_STORAGE_KEY, JSON.stringify({ token: String(token || ''), expira_em: Number(expiraEm || 0) }));
  } catch (err) { console.error('Erro ao salvar sessão segura:', err); }
}

function loadServerSession() {
  try {
    const raw = localStorage.getItem(SERVER_SESSION_STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.token || !parsed.expira_em || Date.now() >= Number(parsed.expira_em)) return null;
    return parsed;
  } catch (err) { return null; }
}

function clearServerSession() {
  try { localStorage.removeItem(SERVER_SESSION_STORAGE_KEY); } catch (err) {}
}

function isUserLogged() { return !!(currentUser && currentUser.id_dgmb); }

function ensureUnifiedAppStyles() {
  if (document.getElementById('meu-giro-unified-app-styles')) return;
  const style = document.createElement('style');
  style.id = 'meu-giro-unified-app-styles';
  style.textContent = `
    .topbar{background:#0f172a!important;color:#fff!important;border-bottom:1px solid #334155!important;padding:0 8px 8px!important;position:sticky!important;top:0!important;z-index:8500!important;box-shadow:0 10px 24px rgba(2,6,23,.28)!important}
    body.meu-giro-auth-unificado .topbar .brand-row{display:none!important}
    .brand-row{min-height:50px!important}.brand{color:#60a5fa!important;font-weight:900!important}.topbar-user-name{color:#cbd5e1!important}
    #btn-logout-top{display:none!important}
    #menu-autenticado-top{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px!important;width:min(500px,100%)!important;margin:0 auto!important;padding-top:8px!important}
    #menu-autenticado-top[hidden]{display:none!important}
    #menu-publico-top[hidden]{display:none!important}
    .dgmb-unified-nav-btn{min-height:44px;border:1px solid #334155;border-radius:9px;background:#1e293b;color:#e5e7eb;font:800 12px/1.15 Arial,sans-serif;cursor:pointer;padding:7px 5px}
    .dgmb-unified-nav-btn:hover{border-color:#60a5fa}.dgmb-unified-nav-btn.ativo{background:#2563eb;border-color:#60a5fa;color:#fff}.dgmb-unified-nav-btn.sair{background:#475569}.dgmb-unified-nav-btn:disabled{opacity:.55;cursor:wait}
    body.portal-embedded-mode .topbar{display:none!important}
    body.portal-embedded-mode .container{padding-top:8px!important}
    body.portal-embedded-mode{margin-top:0!important}
    @media(max-width:520px){.topbar{padding:0 4px 6px!important}#menu-autenticado-top{gap:4px!important;padding-top:6px!important}.dgmb-unified-nav-btn{font-size:10.5px;min-height:42px;padding:5px 2px}}
  `;
  document.head.appendChild(style);
  applyEmbeddedMode();
}

function renderUnifiedAuthenticatedMenu() {
  ensureUnifiedAppStyles();
  const menuPublico = document.getElementById('menu-publico-top');
  const menuAuth = document.getElementById('menu-autenticado-top');
  if (!menuAuth) return;
  if (!isUserLogged()) {
    document.body.classList.remove('meu-giro-auth-unificado');
    menuAuth.hidden = true;
    if (menuPublico) menuPublico.hidden = false;
    return;
  }
  document.body.classList.add('meu-giro-auth-unificado');
  applyEmbeddedMode();
  if (menuPublico) menuPublico.hidden = true;
  menuAuth.hidden = false;
  if (!menuAuth.dataset.unifiedReady) {
    menuAuth.innerHTML = `
      <button type="button" class="dgmb-unified-nav-btn" data-destino="inscricao" onclick="openPortalFromMeuGiro('inscricao', this)">Inscrição</button>
      <button type="button" class="dgmb-unified-nav-btn" data-destino="minhas" onclick="openPortalFromMeuGiro('minhas', this)">Minhas Inscrições</button>
      <button type="button" class="dgmb-unified-nav-btn ativo" data-destino="meugiro" onclick="openMeuGiro()">Meu Giro</button>
      <button type="button" class="dgmb-unified-nav-btn sair" onclick="logoutUser()">Sair</button>`;
    menuAuth.dataset.unifiedReady = '1';
  }
}

function updateAuthUI() {
  const logoutBtn = document.getElementById('btn-logout-top');
  if (logoutBtn) logoutBtn.style.display = 'none';
  renderUnifiedAuthenticatedMenu();
}

function openMeuGiro() {
  if (isUserLogged()) { showScreen('painel'); carregarPainel(); return; }
  const msg = document.getElementById('login-msg');
  if (msg) msg.innerText = 'Entre com seu CPF para acessar seu painel e acompanhar o desafio.';
  showScreen('login');
}

function openRankingPrivado() {
  if (isUserLogged()) { carregarRanking(); return; }
  const msg = document.getElementById('login-msg');
  if (msg) msg.innerText = 'Entre com seu CPF para acompanhar seu progresso e ver o ranking do desafio.';
  showScreen('login');
}

function voltarAoPortalGiro() { window.top.location.href = PORTAL_GIRO_DEV_URL; }

function openPortalFromMeuGiro(destino, botao) {
  const server = loadServerSession();
  if (!server || !server.token) {
    clearServerSession();
    const msg = document.getElementById('login-msg');
    if (msg) msg.innerText = 'Sua sessão integrada expirou. Entre novamente para continuar.';
    showScreen('login');
    return;
  }
  const textoOriginal = botao ? botao.textContent : '';
  if (botao) { botao.disabled = true; botao.textContent = 'Abrindo...'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (botao) { botao.disabled = false; botao.textContent = textoOriginal; }
      if (!res || res.ok !== true || !res.url) {
        const msg = document.getElementById('login-msg');
        if (msg) msg.innerText = (res && res.msg) || 'Não foi possível voltar ao Portal Giro.';
        showScreen('login');
        return;
      }
      window.top.location.href = res.url;
    })
    .withFailureHandler(function(err) {
      if (botao) { botao.disabled = false; botao.textContent = textoOriginal; }
      console.error('Falha ao voltar ao Portal:', err);
      const msg = document.getElementById('login-msg');
      if (msg) msg.innerText = 'Não foi possível voltar ao Portal Giro agora.';
    })
    .portalAtletaCriarHandoff(server.token, destino);
}

function logoutUser() {
  const server = loadServerSession();
  if (server && server.token) {
    google.script.run.withFailureHandler(function(){}).atletaEncerrarSessao(server.token);
  }
  currentUser = null;
  currentPainel = null;
  window.__painelAtual = null;
  clearUserSession();
  clearServerSession();
  const cpfInput = document.getElementById('cpf');
  const loginMsg = document.getElementById('login-msg');
  const registroMsg = document.getElementById('registro-msg');
  const rankingBox = document.getElementById('ranking-lista');
  const kmInput = document.getElementById('km-atividade');
  const dataInput = document.getElementById('data-atividade');
  const fraseBox = document.getElementById('frase-box');
  if (cpfInput) cpfInput.value = '';
  if (loginMsg) loginMsg.innerText = '';
  if (registroMsg) registroMsg.innerText = '';
  if (rankingBox) rankingBox.innerHTML = '';
  if (kmInput) kmInput.value = '';
  if (dataInput) dataInput.value = '';
  if (fraseBox) fraseBox.innerText = 'Cada quilômetro conta. Continue no seu ritmo.';
  updateAuthUI();
  showScreen('inicio');
}

function trocarHandoffAtletaOnLoad() {
  const params = new URLSearchParams(window.location.search || '');
  if (String(params.get('page') || '').toLowerCase() !== 'atleta') return false;
  const handoff = String(params.get('handoff') || '').trim();
  if (!handoff) return false;

  applyEmbeddedMode();
  showScreen('inicio');
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || res.ok !== true || !res.usuario || !res.usuario.id_dgmb) {
        clearUserSession(); clearServerSession();
        const msg = document.getElementById('login-msg');
        if (msg) msg.innerText = (res && res.msg) || 'Acesso integrado inválido ou expirado. Volte ao Portal Giro.';
        showScreen('login');
        return;
      }
      currentUser = { id_dgmb: String(res.usuario.id_dgmb), nome: '', cidade_uf: '' };
      saveUserSession(currentUser);
      saveServerSession(res.session_token, res.expira_em);
      try {
        const limpa = window.location.pathname + (PORTAL_EMBEDDED_MODE ? '?embedded=1' : '');
        window.history.replaceState({}, document.title, limpa);
      } catch (e) {}
      updateAuthUI();
      showScreen('painel');
      carregarPainel();
    })
    .withFailureHandler(function(err) {
      clearUserSession(); clearServerSession();
      console.error('Falha no acesso integrado:', err);
      const msg = document.getElementById('login-msg');
      if (msg) msg.innerText = 'Não foi possível validar o acesso integrado. Volte ao Portal Giro.';
      showScreen('login');
    })
    .atletaTrocarHandoffPorSessao(handoff);
  return true;
}

function restoreUserSessionOnLoad() {
  ensureUnifiedAppStyles();
  applyEmbeddedMode();
  if (trocarHandoffAtletaOnLoad()) return;
  const saved = loadUserSession();
  if (!saved || !saved.id_dgmb) { updateAuthUI(); return; }
  currentUser = saved;
  updateAuthUI();
  showScreen('painel');
  carregarPainel();
}
</script>
