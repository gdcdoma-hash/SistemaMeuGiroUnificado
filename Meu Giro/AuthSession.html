<script>
const SESSION_STORAGE_KEY='MEU_GIRO_CURRENT_USER';const SERVER_SESSION_STORAGE_KEY='MEU_GIRO_SERVER_SESSION';const PORTAL_GIRO_DEV_URL='https://script.google.com/macros/s/AKfycbxq8mpymCTqbMGwMbRpNFxb2_VnDQenwo1TdY6YhYtQw8njg1GBhX1a3Bvt95xSzh6h/exec';let PORTAL_EMBEDDED_MODE=false;let PORTAL_LOCATION_PARAMS={};let PORTAL_NAV_ACK=false;
function applyEmbeddedMode(){if(!PORTAL_EMBEDDED_MODE||!document.body)return;document.body.classList.add('portal-embedded-mode');garantirMenuEmbedded();}
function saveUserSession(user){try{if(!user||!user.id_dgmb)return;localStorage.setItem(SESSION_STORAGE_KEY,JSON.stringify({id_dgmb:String(user.id_dgmb||'').trim(),nome:String(user.nome||''),cidade_uf:String(user.cidade_uf||'')}));}catch(err){}}
function loadUserSession(){try{const raw=localStorage.getItem(SESSION_STORAGE_KEY);if(!raw)return null;const p=JSON.parse(raw);return p&&p.id_dgmb?{id_dgmb:String(p.id_dgmb),nome:String(p.nome||''),cidade_uf:String(p.cidade_uf||'')}:null}catch(e){return null}}
function clearUserSession(){try{localStorage.removeItem(SESSION_STORAGE_KEY)}catch(e){}}
function saveServerSession(token,expiraEm){try{localStorage.setItem(SERVER_SESSION_STORAGE_KEY,JSON.stringify({token:String(token||''),expira_em:Number(expiraEm||0)}))}catch(e){}}
function loadServerSession(){try{const raw=localStorage.getItem(SERVER_SESSION_STORAGE_KEY);if(!raw)return null;const p=JSON.parse(raw);return p&&p.token&&Date.now()<Number(p.expira_em)?p:null}catch(e){return null}}
function clearServerSession(){try{localStorage.removeItem(SERVER_SESSION_STORAGE_KEY)}catch(e){}}
function isUserLogged(){return!!(currentUser&&currentUser.id_dgmb)}
function painelJaCarregado_(){try{return!!(currentPainel||window.__painelAtual)}catch(e){return!!window.__painelAtual}}
function abrirInicioMeuGiro_(){showScreen('painel');if(!painelJaCarregado_())carregarPainel('nav')}
function ensureUnifiedAppStyles(){if(document.getElementById('meu-giro-unified-app-styles'))return;const s=document.createElement('style');s.id='meu-giro-unified-app-styles';s.textContent=`.topbar{background:#0f172a!important;color:#fff!important;border-bottom:1px solid #334155!important;position:sticky!important;top:0!important;z-index:8500!important}.dgmb-unified-nav-btn{min-height:42px;border:1px solid #334155;border-radius:9px;background:#1e293b;color:#e5e7eb;font:800 11px Arial,sans-serif;cursor:pointer;padding:6px 5px}.dgmb-unified-nav-btn.ativo{background:#2563eb;border-color:#60a5fa;color:#fff}#dgmb-meugiro-embedded-nav{display:none}body.portal-embedded-mode .topbar{display:none!important}body.portal-embedded-mode #dgmb-meugiro-embedded-nav{position:sticky;top:0;z-index:9000;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%;max-width:680px;margin:0 auto;padding:8px;background:#0f172a;border-radius:0 0 14px 14px;box-sizing:border-box;box-shadow:0 8px 20px rgba(2,6,23,.25)}body.portal-embedded-mode{margin:0!important;background:#f3f4f6!important;min-height:100vh!important;overflow-x:hidden!important}body.portal-embedded-mode .container{width:100%!important;max-width:100%!important;margin:0!important;padding:12px max(12px,calc((100% - 720px)/2)) 30px!important;box-sizing:border-box;background:#f3f4f6!important}body.portal-embedded-mode .nav-v2{display:none!important}body.portal-embedded-mode.v2-nav-authenticated .container{padding-bottom:30px!important}body.portal-embedded-mode .app-loading-overlay,body.portal-embedded-mode #app-loading-overlay,body.portal-embedded-mode .loading-overlay,body.portal-embedded-mode .modal-loading{display:none!important}#dgmb-retorno-portal-loading{position:fixed;inset:0;z-index:30000;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.72);padding:20px;box-sizing:border-box}#dgmb-retorno-portal-loading.ativo{display:flex}#dgmb-retorno-portal-card{width:min(360px,92vw);padding:24px 20px;border-radius:18px;background:#fff;color:#0f172a;text-align:center;box-shadow:0 22px 55px rgba(0,0,0,.32);font-family:Arial,sans-serif}#dgmb-retorno-portal-spinner{width:38px;height:38px;margin:0 auto 14px;border:4px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:dgmbRetornoSpin .8s linear infinite}#dgmb-retorno-portal-card strong{display:block;font-size:18px;font-weight:900;margin-bottom:7px}#dgmb-retorno-portal-card span{font-size:14px;line-height:1.4;color:#475569}@keyframes dgmbRetornoSpin{to{transform:rotate(360deg)}}@media(max-width:700px){body.portal-embedded-mode #dgmb-meugiro-embedded-nav{grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:5px 3px}.dgmb-unified-nav-btn{font-size:9.5px;min-height:39px;padding:4px 2px}}`;document.head.appendChild(s)}
function mostrarRetornoPortal_(){ensureUnifiedAppStyles();let o=document.getElementById('dgmb-retorno-portal-loading');if(!o){o=document.createElement('div');o.id='dgmb-retorno-portal-loading';o.setAttribute('role','status');o.setAttribute('aria-live','polite');o.innerHTML='<div id="dgmb-retorno-portal-card"><div id="dgmb-retorno-portal-spinner"></div><strong>DESAFIO GIRO</strong><span>Voltando ao Portal Giro...</span></div>';document.body.appendChild(o)}o.classList.add('ativo')}
function ocultarRetornoPortal_(){const o=document.getElementById('dgmb-retorno-portal-loading');if(o)o.classList.remove('ativo')}
function garantirMenuEmbedded(){if(!PORTAL_EMBEDDED_MODE||!document.body)return;ensureUnifiedAppStyles();let n=document.getElementById('dgmb-meugiro-embedded-nav');if(!n){n=document.createElement('nav');n.id='dgmb-meugiro-embedded-nav';n.setAttribute('aria-label','Navegação Meu Giro');n.innerHTML='<button class="dgmb-unified-nav-btn" data-mg="portal">Portal Giro</button><button class="dgmb-unified-nav-btn ativo" data-mg="inicio">Início</button><button class="dgmb-unified-nav-btn" data-mg="desafios">Desafios</button><button class="dgmb-unified-nav-btn" data-mg="registrar">Registrar</button><button class="dgmb-unified-nav-btn" data-mg="conquistas">Conquistas</button>';document.body.insertBefore(n,document.body.firstChild);n.addEventListener('click',function(e){const b=e.target.closest('[data-mg]');if(!b)return;const d=b.getAttribute('data-mg');if(d==='portal'){openPortalFromMeuGiro('minhas',b);return}n.querySelectorAll('[data-mg]').forEach(x=>x.classList.toggle('ativo',x===b));navMeuGiro(d)})}}
function navMeuGiro(d){if(d==='inicio'){abrirInicioMeuGiro_();return}if(d==='desafios'){navigateV2('challenges');return}if(d==='registrar'){navigateV2('register');return}if(d==='conquistas'){navigateV2('achievements')}}
function renderUnifiedAuthenticatedMenu(){ensureUnifiedAppStyles();if(PORTAL_EMBEDDED_MODE){garantirMenuEmbedded();return}const pub=document.getElementById('menu-publico-top'),auth=document.getElementById('menu-autenticado-top');if(!auth)return;if(!isUserLogged()){auth.hidden=true;if(pub)pub.hidden=false;return}if(pub)pub.hidden=true;auth.hidden=false;auth.innerHTML='<button class="dgmb-unified-nav-btn" onclick="openPortalFromMeuGiro(\'inscricao\',this)">Inscrição</button><button class="dgmb-unified-nav-btn" onclick="openPortalFromMeuGiro(\'minhas\',this)">Minhas Inscrições</button><button class="dgmb-unified-nav-btn ativo" onclick="openMeuGiro()">Meu Giro</button><button class="dgmb-unified-nav-btn" onclick="logoutUser()">Sair</button>'}
function updateAuthUI(){const b=document.getElementById('btn-logout-top');if(b)b.style.display='none';renderUnifiedAuthenticatedMenu()}
function openMeuGiro(){if(isUserLogged()){abrirInicioMeuGiro_();return}showScreen('login')}
function openRankingPrivado(){if(isUserLogged()){carregarRanking();return}showScreen('login')}
function voltarAoPortalGiro(){openPortalFromMeuGiro('minhas',null)}
function abrirPortalPorHandoff_(destino){const server=loadServerSession();if(!server||!server.token){ocultarRetornoPortal_();clearServerSession();showScreen('login');return}google.script.run.withSuccessHandler(function(res){if(res&&res.ok===true&&res.url)window.top.location.href=res.url;else ocultarRetornoPortal_()}).withFailureHandler(function(){ocultarRetornoPortal_()}).portalAtletaCriarHandoff(server.token,destino)}
function enviarPortalNavEmbedded_(destino){
  var payload={type:'DGMB_PORTAL_NAV',destino:destino};
  var alvos=[];
  try{if(window.parent&&window.parent!==window)alvos.push(window.parent)}catch(e){}
  try{if(window.parent&&window.parent.parent)alvos.push(window.parent.parent)}catch(e){}
  try{if(window.parent&&window.parent.parent&&window.parent.parent.parent)alvos.push(window.parent.parent.parent)}catch(e){}
  try{if(window.top&&window.top!==window)alvos.push(window.top)}catch(e){}
  alvos.forEach(function(alvo,indice){
    if(!alvo||typeof alvo.postMessage!=='function')return;
    for(var i=0;i<indice;i++){if(alvos[i]===alvo)return}
    try{alvo.postMessage(payload,'*')}catch(e){}
  });
}
function openPortalFromMeuGiro(destino,botao){
  destino=destino||'minhas';
  mostrarRetornoPortal_();
  if(PORTAL_EMBEDDED_MODE){
    PORTAL_NAV_ACK=false;
    [0,180,420].forEach(function(atraso){
      setTimeout(function(){if(!PORTAL_NAV_ACK)enviarPortalNavEmbedded_(destino)},atraso);
    });
    setTimeout(function(){
      if(PORTAL_NAV_ACK)return;
      ocultarRetornoPortal_();
      try{
        if(typeof setPainelMsg==='function')setPainelMsg('Não foi possível voltar ao Portal Giro. Tente novamente.','error');
      }catch(e){}
    },900);
    return;
  }
  abrirPortalPorHandoff_(destino);
}
window.addEventListener('message',function(ev){
  if(ev&&ev.data&&ev.data.type==='DGMB_PORTAL_NAV_ACK'){
    PORTAL_NAV_ACK=true;
    ocultarRetornoPortal_();
  }
});
function logoutUser(){const s=loadServerSession();if(s&&s.token)google.script.run.withFailureHandler(function(){}).atletaEncerrarSessao(s.token);currentUser=null;currentPainel=null;window.__painelAtual=null;clearUserSession();clearServerSession();updateAuthUI();showScreen('inicio')}
function iniciarHandoffAtleta_(handoff){handoff=String(handoff||'').trim();if(!handoff)return false;currentUser=null;currentPainel=null;clearUserSession();clearServerSession();applyEmbeddedMode();showScreen('inicio');google.script.run.withSuccessHandler(function(res){if(!res||res.ok!==true||!res.usuario||!res.usuario.id_dgmb){showScreen('login');return}currentUser={id_dgmb:String(res.usuario.id_dgmb),nome:'',cidade_uf:''};saveUserSession(currentUser);saveServerSession(res.session_token,res.expira_em);updateAuthUI();showScreen('painel');carregarPainel()}).atletaTrocarHandoffPorSessao(handoff);return true}
function processarLocalizacaoInicial_(loc){const p=loc&&loc.parameter?loc.parameter:{};PORTAL_LOCATION_PARAMS=p;PORTAL_EMBEDDED_MODE=PORTAL_EMBEDDED_MODE||String(p.embedded||'').trim()==='1';applyEmbeddedMode();const page=String(p.page||'').toLowerCase(),handoff=String(p.handoff||'').trim();if(page==='atleta'&&handoff){iniciarHandoffAtleta_(handoff);return}if(PORTAL_EMBEDDED_MODE){garantirMenuEmbedded();return}const saved=loadUserSession();if(saved&&saved.id_dgmb){currentUser=saved;updateAuthUI();showScreen('painel');carregarPainel()}else updateAuthUI()}
function restoreUserSessionOnLoad(){
  ensureUnifiedAppStyles();
  const boot=window.__MEU_GIRO_BOOT__||{};
  if(boot.embedded){
    PORTAL_EMBEDDED_MODE=true;
    applyEmbeddedMode();
  }

  var pageBoot=String(boot.page||'').trim().toLowerCase();
  var handoffBoot=String(boot.handoff||'').trim();
  if(pageBoot==='atleta'&&handoffBoot){
    processarLocalizacaoInicial_({
      parameter:{
        page:'atleta',
        handoff:handoffBoot,
        embedded:boot.embedded?'1':''
      }
    });
    return;
  }

  if(window.google&&google.script&&google.script.url){
    google.script.url.getLocation(function(loc){processarLocalizacaoInicial_(loc||{})});
  }else{
    processarLocalizacaoInicial_({parameter:{}});
  }
}
</script>
