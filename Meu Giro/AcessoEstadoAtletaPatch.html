<script id="meu-giro-acesso-estado-atleta">
(function(){
var estadoSemDesafioAtivo=false,modalJaMostrado=false;function texto(v){return String(v||'').trim()}function normalizar(v){return texto(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function navegarPortal(destino){try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'DGMB_PORTAL_NAV',destino:destino},'*');return}}catch(e){}try{if(typeof openPortalFromMeuGiro==='function')openPortalFromMeuGiro(destino,null)}catch(e){}}
function classificarMensagem(msg){var m=normalizar(msg);if(!m)return null;if(m.indexOf('aguard')!==-1&&(m.indexOf('consolid')!==-1||m.indexOf('confirm')!==-1||m.indexOf('pagamento')!==-1))return{titulo:'Sua inscrição está quase pronta!',mensagem:'Assim que sua inscrição for confirmada, o Meu Giro ficará disponível.',botao:'Entendi'};if(m.indexOf('nao conclu')!==-1)return{titulo:'Continue com a gente 🚴',mensagem:'Este desafio terminou. Que tal escolher sua próxima meta?',botao:'Ver desafios',destino:'inscricao'};if(m.indexOf('nao ha inscricao valida')!==-1||m.indexOf('inscricao valida registrada')!==-1||m.indexOf('nenhuma inscricao')!==-1){estadoSemDesafioAtivo=true;return{titulo:'Pronto para o próximo desafio? 🚴',mensagem:'Você não tem um desafio ativo no Meu Giro neste momento.',botao:'Ver desafios',destino:'inscricao'}}if(m.indexOf('ainda nao iniciou')!==-1||m.indexOf('data de inicio')!==-1)return{titulo:'Seu desafio está chegando!',mensagem:'O Meu Giro será liberado na data de início do seu desafio.',botao:'Entendi'};return null}
function limparErrosResiduais(){if(!estadoSemDesafioAtivo)return;var ids=['painel-msg','painel-error-state'];ids.forEach(function(id){var n=document.getElementById(id);if(n){n.innerHTML='';n.hidden=true;n.style.display='none'}});document.querySelectorAll('.status-message,.status-msg,.painel-msg,.message,.alert,.erro,.error,.painel-error-state').forEach(function(node){var t=normalizar(node.textContent);if(t.indexOf('inscricao valida')!==-1||t.indexOf('nao foi possivel atualizar seu painel')!==-1||t.indexOf('erro ao carregar painel')!==-1||t.indexOf('erro de conexao')!==-1)node.style.display='none'})}
function mostrarEstado(estado){if(!estado||typeof mostrarModalMeuGiro!=='function')return false;if(modalJaMostrado&&estadoSemDesafioAtivo)return true;modalJaMostrado=true;mostrarModalMeuGiro({titulo:estado.titulo,mensagem:estado.mensagem,tipo:'orientacao',processando:false,origem:'estado-atleta',botoes:[{texto:estado.botao||'Entendi',valor:true,destaque:true,acao:function(){if(estado.destino)navegarPortal(estado.destino)}}]});setTimeout(limparErrosResiduais,0);setTimeout(limparErrosResiduais,500);return true}
if(typeof setPainelMsg==='function'){var originalSetPainelMsg=setPainelMsg;setPainelMsg=function(message,variant,timeoutMs){var estado=variant==='error'?classificarMensagem(message):null;if(estado){mostrarEstado(estado);limparErrosResiduais();return}if(estadoSemDesafioAtivo&&variant==='error'){limparErrosResiduais();return}originalSetPainelMsg(message,variant,timeoutMs)}}
window.MeuGiroEstadoAtleta={classificarMensagem:classificarMensagem,mostrarEstado:mostrarEstado,semDesafio:function(){return estadoSemDesafioAtivo}};
})();
</script>
