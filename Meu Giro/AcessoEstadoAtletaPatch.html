<script id="meu-giro-acesso-estado-atleta">
(function(){
  var estadoSemDesafioAtivo=false;
  function texto(v){return String(v||'').trim();}
  function normalizar(v){return texto(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
  function navegarPortal(destino){try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'DGMB_PORTAL_NAV',destino:destino},'*');return;}}catch(e){}try{if(typeof openPortalFromMeuGiro==='function')openPortalFromMeuGiro(destino,null);}catch(e){}}
  function classificarMensagem(msg){var m=normalizar(msg);if(!m)return null;if(m.indexOf('aguard')!==-1&&(m.indexOf('consolid')!==-1||m.indexOf('confirm')!==-1||m.indexOf('pagamento')!==-1))return{titulo:'Sua inscrição está quase pronta!',mensagem:'Sua inscrição está aguardando confirmação. Assim que for consolidada, o Meu Giro ficará disponível.',botao:'Entendi'};if(m.indexOf('nao conclu')!==-1)return{titulo:'Continue com a gente 🚴',mensagem:'Este desafio terminou, mas uma nova meta pode começar agora.',botao:'Ver desafios',destino:'inscricao'};if(m.indexOf('nao ha inscricao valida')!==-1||m.indexOf('inscricao valida registrada')!==-1||m.indexOf('nenhuma inscricao')!==-1){estadoSemDesafioAtivo=true;return{titulo:'Pronto para o próximo desafio? 🚴',mensagem:'No momento, você não tem um desafio ativo no Meu Giro.',botao:'Ver desafios',destino:'inscricao'};}if(m.indexOf('ainda nao iniciou')!==-1||m.indexOf('data de inicio')!==-1)return{titulo:'Seu desafio está chegando!',mensagem:'Sua inscrição está pronta. O Meu Giro será liberado quando chegar a data de início.',botao:'Entendi'};return null;}
  function limparErrosResiduais(){if(!estadoSemDesafioAtivo)return;document.querySelectorAll('.status-message,.painel-msg,.message,.alert,.erro,.error').forEach(function(node){var t=normalizar(node.textContent);if(t.indexOf('inscricao valida')!==-1||t.indexOf('nao foi possivel atualizar seu painel')!==-1||t.indexOf('erro ao carregar painel')!==-1||t.indexOf('erro de conexao ao atualizar painel')!==-1){node.style.display='none';}});}
  function mostrarEstado(estado){if(!estado||typeof mostrarModalMeuGiro!=='function')return false;var botoes=[{texto:estado.botao||'Entendi',valor:true,destaque:true,acao:function(){if(estado.destino)navegarPortal(estado.destino);}}];mostrarModalMeuGiro({titulo:estado.titulo,mensagem:estado.mensagem,tipo:'orientacao',processando:false,origem:'estado-atleta',botoes:botoes});window.setTimeout(limparErrosResiduais,0);return true;}
  if(typeof setPainelMsg==='function'){var originalSetPainelMsg=setPainelMsg;setPainelMsg=function(message,variant,timeoutMs){var estado=variant==='error'?classificarMensagem(message):null;if(estado){mostrarEstado(estado);limparErrosResiduais();return;}if(estadoSemDesafioAtivo&&variant==='error'){var m=normalizar(message);if(m.indexOf('atualizar')!==-1||m.indexOf('painel')!==-1||m.indexOf('inscricao')!==-1){limparErrosResiduais();return;}}originalSetPainelMsg(message,variant,timeoutMs);};}
  window.MeuGiroEstadoAtleta={classificarMensagem:classificarMensagem,mostrarEstado:mostrarEstado,semDesafio:function(){return estadoSemDesafioAtivo;}};
})();
</script>
